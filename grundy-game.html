  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: #1a1a2e; overflow: hidden; }
    .game-container { width: 100vw; height: 100vh; max-width: 430px; margin: 0 auto; position: relative; }
    @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-20px) scale(1.1); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes sparkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.2); } }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
    @keyframes confetti { 0% { transform: translateY(0) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    .animate-bounce-custom { animation: bounce 0.6s ease-in-out; }
    .animate-pulse-custom { animation: pulse 2s ease-in-out infinite; }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-sparkle { animation: sparkle 1.5s ease-in-out infinite; }
    .animate-slideUp { animation: slideUp 0.3s ease-out; }
    .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
    .animate-shake { animation: shake 0.3s ease-in-out; }
    .confetti { position: fixed; animation: confetti 3s ease-out forwards; pointer-events: none; font-size: 24px; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    .pet-shadow { filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3)); }
    .glow { box-shadow: 0 0 20px currentColor; }
    /* Phase 5: Pet Animations */
    @keyframes idle-bob { 0%, 100% { transform: translateY(0) scale(var(--weight-scale, 1)); } 50% { transform: translateY(-8px) scale(var(--weight-scale, 1)); } }
    @keyframes happy-bounce { 0%, 100% { transform: translateY(0) scale(var(--weight-scale, 1)) rotate(0deg); } 25% { transform: translateY(-15px) scale(calc(var(--weight-scale, 1) * 1.05)) rotate(-5deg); } 75% { transform: translateY(-15px) scale(calc(var(--weight-scale, 1) * 1.05)) rotate(5deg); } }
    @keyframes sad-droop { 0%, 100% { transform: translateY(0) scale(var(--weight-scale, 1)); } 50% { transform: translateY(5px) scale(calc(var(--weight-scale, 1) * 0.95)); } }
    @keyframes hungry-wobble { 0%, 100% { transform: translateY(0) rotate(0deg) scale(var(--weight-scale, 1)); } 25% { transform: translateY(-3px) rotate(-3deg); } 75% { transform: translateY(-3px) rotate(3deg); } }
    @keyframes sick-shake { 0%, 100% { transform: translateX(0) scale(var(--weight-scale, 1)); } 10%, 30%, 50%, 70%, 90% { transform: translateX(-2px); } 20%, 40%, 60%, 80% { transform: translateX(2px); } }
    @keyframes eating { 0% { transform: scale(var(--weight-scale, 1)); } 15% { transform: scale(calc(var(--weight-scale, 1) * 1.15)); } 30% { transform: scale(var(--weight-scale, 1)); } 45% { transform: scale(calc(var(--weight-scale, 1) * 1.1)); } 60% { transform: scale(var(--weight-scale, 1)); } 100% { transform: scale(var(--weight-scale, 1)); } }
    @keyframes sleeping { 0%, 100% { transform: translateY(0) scale(var(--weight-scale, 1)); opacity: 0.8; } 50% { transform: translateY(3px) scale(calc(var(--weight-scale, 1) * 0.98)); opacity: 0.6; } }
    @keyframes slide-down { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .animate-idle { animation: idle-bob 2.5s ease-in-out infinite; }
    .animate-happy { animation: happy-bounce 0.8s ease-in-out infinite; }
    .animate-sad { animation: sad-droop 2s ease-in-out infinite; }
    .animate-hungry { animation: hungry-wobble 0.5s ease-in-out infinite; }
    .animate-sick { animation: sick-shake 0.8s ease-in-out infinite; }
    .animate-eating { animation: eating 0.8s ease-out; }
    .animate-sleeping { animation: sleeping 3s ease-in-out infinite; }
    .animate-slide-down { animation: slide-down 0.3s ease-out; }
  </style>
</head>

    const STORY_SCREENS = [
      { title: 'A Magical Discovery', text: 'One day, while exploring the Whimsy Woods, you stumbled upon something extraordinary...', emoji: '🌲' },
      { title: 'A Tiny Creature', text: 'A small, adorable creature looked up at you with big, hopeful eyes. It seemed lost and hungry.', emoji: '👀' },

    // PHASE 1: HYBRID MODE SYSTEM (WEB-036, 037, 038, 051)
    // ============================================================

    // Game Mode Configuration
    const GameMode = { Casual: 'casual', Classic: 'classic' };

    const MODE_CONFIG = {

    // Happiness System (WEB-037)
    const HAPPINESS_TIERS = [
      { tier: 1, label: 'Miserable', icon: '😢', min: 0, max: 20, xpMult: 0.7, coinMult: 0.7 },
      { tier: 2, label: 'Unhappy', icon: '😔', min: 21, max: 40, xpMult: 0.85, coinMult: 0.85 },

    ];

    const getHappinessTier = (happiness) =>
      HAPPINESS_TIERS.find(t => happiness >= t.min && happiness <= t.max) || HAPPINESS_TIERS[2];

    // Weight System (WEB-038)
    const WEIGHT_STATUS = {
      underweight: { min: 50, max: 69, label: 'Underweight', icon: '🦴', moodMod: -10, sickRisk: 1.3 },
      slim: { min: 70, max: 89, label: 'Slim', icon: '🏃', moodMod: 5, sickRisk: 1.0 },

    const getWeightStatus = (weight) => {
      if (weight < 70) return WEIGHT_STATUS.underweight;
      if (weight < 90) return WEIGHT_STATUS.slim;
      if (weight <= 110) return WEIGHT_STATUS.ideal;
      if (weight <= 130) return WEIGHT_STATUS.chubby;

    // Stomach System (WEB-051)
    const STOMACH_CONFIG = {

      overfeedMoodPenalty: -15,

      const pct = current / capacity;

      const last = new Date(lastLogin);

      return last.toDateString() !== now.toDateString();

      if (!lastLogin) return false;
      const last = new Date(lastLogin);
      const now = new Date();
      const diffDays = Math.floor((now - last) / (1000 * 60 * 60 * 24));

    // Notifications (WEB-049)

    // ============================================================
    // PHASE 4: AUDIO SYSTEM (WEB-052-062)

    // AudioManager (WEB-052)
    const AudioManager = {
      ctx: null,
      gainNodes: { master: null, sfx: null, music: null },
      sounds: new Map(),
      isUnlocked: false,
      soundEnabled: true,
      musicEnabled: true,
      masterVolume: 0.7,
      sfxVolume: 0.8,
      musicVolume: 0.5,

      async init() {
        if (this.ctx) return;
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();

        // Create gain node hierarchy
        this.gainNodes.master = this.ctx.createGain();
        this.gainNodes.sfx = this.ctx.createGain();
        this.gainNodes.music = this.ctx.createGain();

        this.gainNodes.sfx.connect(this.gainNodes.master);
        this.gainNodes.music.connect(this.gainNodes.master);
        this.gainNodes.master.connect(this.ctx.destination);

        this.setMasterVolume(this.masterVolume);
        this.setSfxVolume(this.sfxVolume);

        // Load saved preferences
        try {
          const saved = localStorage.getItem('grundy-audio');
          if (saved) {
            const prefs = JSON.parse(saved);
            this.soundEnabled = prefs.soundEnabled ?? true;
            this.musicEnabled = prefs.musicEnabled ?? true;
            this.masterVolume = prefs.masterVolume ?? 0.7;
          }
        } catch (e) {}

        // Synthesize sounds
        await this.synthesizeSounds();
      },

      async synthesizeSounds() {
        if (!this.ctx) return;
        const sr = this.ctx.sampleRate;

        // Feed sound - happy chirp
        this.sounds.set('feed', this.synthSound(sr, 0.3, (t) =>
          (Math.sin(2 * Math.PI * 880 * t) * 0.3 + Math.sin(2 * Math.PI * 1320 * t) * 0.2) * Math.exp(-t * 10)
        ));

        // Coin sound - rising pitch
        this.sounds.set('coin', this.synthSound(sr, 0.15, (t) =>
          Math.sin(2 * Math.PI * (1000 + t * 2000) * t) * Math.exp(-t * 15) * 0.4
        ));

        // Level up - fanfare
        this.sounds.set('levelUp', this.synthSound(sr, 1.0, (t) => {
          const notes = [523, 659, 784, 1047];
          const noteIndex = Math.floor(t * 4);
          if (noteIndex >= notes.length) return 0;
          const freq = notes[noteIndex];
          const noteT = t - noteIndex * 0.25;
          return Math.sin(2 * Math.PI * freq * noteT) * Math.exp(-noteT * 4) * 0.3;
        }));

        // Tap sound
        this.sounds.set('tap', this.synthSound(sr, 0.08, (t) =>
          Math.sin(2 * Math.PI * 600 * t) * Math.exp(-t * 30) * 0.3
        ));

        // Error sound
        this.sounds.set('error', this.synthSound(sr, 0.2, (t) =>
          Math.sin(2 * Math.PI * 200 * t) * Math.exp(-t * 8) * 0.4
        ));

        // Poop sound
        this.sounds.set('poop', this.synthSound(sr, 0.2, (t) =>
          Math.sin(2 * Math.PI * (150 - t * 100) * t) * Math.exp(-t * 5) * 0.3
        ));

        // Clean sound
        this.sounds.set('clean', this.synthSound(sr, 0.25, (t) =>
          (Math.sin(2 * Math.PI * 400 * t) * 0.2 + Math.sin(2 * Math.PI * 800 * t) * 0.2) * Math.exp(-t * 8)
        ));

        // Sick sound
        this.sounds.set('sick', this.synthSound(sr, 0.4, (t) =>
          Math.sin(2 * Math.PI * (300 + Math.sin(t * 10) * 50) * t) * Math.exp(-t * 3) * 0.3
        ));
      },

      synthSound(sampleRate, duration, generator) {
        const buffer = this.ctx.createBuffer(1, sampleRate * duration, sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < buffer.length; i++) {
          const t = i / sampleRate;
          data[i] = generator(t);
        }
        return buffer;
      },

      async unlock() {
        if (this.isUnlocked) return true;
        if (!this.ctx) await this.init();

        try {
          if (this.ctx.state === 'suspended') {
            await this.ctx.resume();
          }
          // Play silent buffer to fully unlock
          const buffer = this.ctx.createBuffer(1, 1, 22050);
          const source = this.ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(this.ctx.destination);
          source.start();
          this.isUnlocked = true;
          return true;
        } catch (e) {
          console.warn('Audio unlock failed:', e);
          return false;
        }
      },

      playSfx(id) {
        if (!this.soundEnabled || !this.ctx || !this.isUnlocked) return;
        const buffer = this.sounds.get(id);
        if (!buffer) return;

        const source = this.ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(this.gainNodes.sfx);
        source.start();
      },

      setMasterVolume(vol) {
        this.masterVolume = vol;
        if (this.gainNodes.master) {
          this.gainNodes.master.gain.value = vol;
        }
        this.savePrefs();
      },

      setSfxVolume(vol) {
        this.sfxVolume = vol;
        if (this.gainNodes.sfx) {
          this.gainNodes.sfx.gain.value = vol;
        }
      },

      toggleSound() {
        this.soundEnabled = !this.soundEnabled;
        this.savePrefs();
        return this.soundEnabled;
      },

      toggleMusic() {
        this.musicEnabled = !this.musicEnabled;
        this.savePrefs();
        return this.musicEnabled;
      },

      savePrefs() {
        try {
          localStorage.setItem('grundy-audio', JSON.stringify({
            soundEnabled: this.soundEnabled,
            musicEnabled: this.musicEnabled,
            masterVolume: this.masterVolume
          }));
        } catch (e) {}
      }
    };

    // VibrationManager (WEB-053)
    const VibrationManager = {
      enabled: true,
      supportsVibration: typeof navigator !== 'undefined' && 'vibrate' in navigator,

      init() {
        try {
          const saved = localStorage.getItem('grundy-vibration');
          if (saved !== null) {
            this.enabled = saved === 'true';
          }
        } catch (e) {}
      },

      vibrate(pattern) {
        if (!this.enabled || !this.supportsVibration) return;
        navigator.vibrate(pattern);
      },

      vibratePreset(preset) {
        const patterns = {
          tap: 10,
          success: [10, 50, 10],
          error: [100],
          feed: [30],
          levelUp: [50, 100, 50, 100, 100],
          notification: [100, 50, 100]
        };
        this.vibrate(patterns[preset] || 10);
      },

      stop() {
        if (this.supportsVibration) navigator.vibrate(0);
      },

      toggle() {
        this.enabled = !this.enabled;
        try {
          localStorage.setItem('grundy-vibration', String(this.enabled));
        } catch (e) {}
        return this.enabled;
      }
    };

    // iOS Audio Unlock (WEB-061)
    const IOSAudioUnlock = {
      needsUnlock: typeof navigator !== 'undefined' && /iPad|iPhone|iPod/.test(navigator.userAgent),
      isUnlocked: false,

      attachUnlockListener() {
        if (!this.needsUnlock || this.isUnlocked) return;

        const handler = async () => {
          if (await AudioManager.unlock()) {
            this.isUnlocked = true;
            document.removeEventListener('touchstart', handler);
            document.removeEventListener('touchend', handler);
            document.removeEventListener('click', handler);
          }
        };

        document.addEventListener('touchstart', handler, { passive: true });
        document.addEventListener('touchend', handler, { passive: true });
        document.addEventListener('click', handler, { passive: true });
      }
    };

    const InstallPromptBanner = ({ onDismiss }) => {
      const [isVisible, setIsVisible] = useState(false);
      const [isInstalling, setIsInstalling] = useState(false);

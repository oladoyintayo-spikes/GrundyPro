        // Check if install prompt is available
        const checkInstallAvailable = () => {
          if (window.deferredInstallPrompt && !window.isPWAInstalled) {
            setIsVisible(true);
          }
        };

        // Check on mount
        checkInstallAvailable();

        // Listen for install prompt becoming available
        const handleInstallAvailable = () => setIsVisible(true);
        const handleInstalled = () => setIsVisible(false);

        window.addEventListener('pwa-install-available', handleInstallAvailable);
        window.addEventListener('pwa-installed', handleInstalled);

        return () => {
          window.removeEventListener('pwa-install-available', handleInstallAvailable);
          window.removeEventListener('pwa-installed', handleInstalled);
        };
      }, []);

      const handleInstall = async () => {
        setIsInstalling(true);
        try {
          const accepted = await window.triggerPWAInstall();
          if (accepted) {
            setIsVisible(false);
          }
        } catch (e) {
          console.error('Install failed:', e);
        }
        setIsInstalling(false);
      };

      const handleDismiss = () => {
        setIsVisible(false);
        // Store dismissal in session to not show again this session
        sessionStorage.setItem('pwa-install-dismissed', 'true');
        if (onDismiss) onDismiss();
      };

      // Don't show if already dismissed this session
      if (!isVisible || sessionStorage.getItem('pwa-install-dismissed')) return null;

      return (
        <div className="fixed bottom-20 left-4 right-4 z-50 animate-slideUp">
          <div className="glass rounded-2xl p-4 bg-gradient-to-r from-yellow-500/20 to-amber-500/20 border border-yellow-400/30 shadow-xl">
            <div className="flex items-start gap-3">
              <div className="text-4xl animate-pulse-custom">📱</div>
              <div className="flex-1">
                <h3 className="text-yellow-300 font-bold text-lg">Install Grundy!</h3>
                <p className="text-white/80 text-sm mt-1">
                  Add to your home screen for the best experience - play offline anytime!
                </p>
              </div>
            </div>
            <div className="flex gap-2 mt-4">
              <button
                onClick={handleDismiss}
                className="flex-1 py-2 glass rounded-xl text-white/70 font-medium text-sm hover:bg-white/10 transition-colors"
              >
                Maybe Later
              </button>
              <button
                onClick={handleInstall}
                disabled={isInstalling}
                className="flex-1 py-2 bg-gradient-to-r from-yellow-400 to-amber-500 rounded-xl text-black font-bold text-sm hover:from-yellow-300 hover:to-amber-400 transition-all disabled:opacity-50"
              >
                {isInstalling ? 'Installing...' : 'Install'}
              </button>
            </div>
          </div>
        </div>
      );
    };

    // Tutorial Screen - Fixed with proper step progression and reaction feedback
    const TutorialScreen = ({ step, petState, pet, inventory, onAction, onSkip }) => {
      const tutorial = TUTORIAL_STEPS[step];
      const [tutorialState, setTutorialState] = useState('idle'); // 'idle' | 'feeding' | 'reacting' | 'ready'
      const [feedReaction, setFeedReaction] = useState(null);

      // Reset state when step changes
      useEffect(() => {
        setTutorialState('idle');
        setFeedReaction(null);
      }, [step]);

      const handleFeed = (foodId) => {
        if (tutorialState !== 'idle') return;

        const food = FOODS[foodId];
        const affinity = food.affinities[pet.id] || 'neutral';

        // Show feeding animation
        setTutorialState('feeding');

        // After short delay, show reaction
        setTimeout(() => {
          setFeedReaction({
            affinity,
            xpGained: Math.round(food.xp * AFFINITY_MULTIPLIERS[affinity]),
            emoji: affinity === 'loved' ? '🤩' : affinity === 'liked' ? '😋' : affinity === 'disliked' ? '😖' : '😊',
            message: affinity === 'loved' ? 'LOVES IT!' : affinity === 'liked' ? 'Yummy!' : affinity === 'disliked' ? 'Yuck...' : 'Nom!',
            color: affinity === 'loved' ? '#fbbf24' : affinity === 'liked' ? '#4ade80' : affinity === 'disliked' ? '#f87171' : '#60a5fa'
          });
          setTutorialState('reacting');

          // After reaction, advance to next step
          setTimeout(() => {
            setTutorialState('ready');
            onAction();
          }, 1800);
        }, 300);
      };

      const needsFeed = tutorial.action === 'feed' && tutorialState === 'idle';
      const showReaction = tutorialState === 'reacting' && feedReaction;
      const showButton = tutorial.action !== 'feed' || tutorialState === 'ready';

      return (
        <div className="h-full bg-gradient-to-b from-indigo-900 to-purple-900 flex flex-col">
          <div className="p-4 flex justify-end">
            <button onClick={onSkip} className="text-white/50 text-sm">Skip Tutorial</button>
          </div>

          <div className="flex-1 flex flex-col items-center justify-center p-6 relative">
            <PetDisplay pet={pet} petState={petState} />

            {/* Reaction popup during tutorial */}
            {showReaction && (
              <div className="absolute inset-0 flex items-center justify-center pointer-events-none z-20">
                <div className="animate-bounce-custom text-center bg-black/50 rounded-3xl p-6">
                  <div className="text-6xl">{feedReaction.emoji}</div>
                  <div className="text-xl font-bold mt-2" style={{ color: feedReaction.color }}>{feedReaction.message}</div>
                  <div className="text-white text-lg">+{feedReaction.xpGained} XP</div>
                </div>
              </div>
            )}

            <div className="glass rounded-2xl p-6 mt-6 w-full max-w-sm">
              <h3 className="text-white font-bold text-lg mb-2">{tutorial.title}</h3>
              <p className="text-white/80">{tutorial.message}</p>
            </div>

            {needsFeed && (
              <div className="grid grid-cols-3 gap-3 mt-6">
                {Object.entries(inventory).filter(([_, c]) => c > 0).slice(0, 3).map(([foodId, count]) => (
                  <FoodItem key={foodId} food={FOODS[foodId]} count={count} onClick={() => handleFeed(foodId)} />
                ))}
              </div>
            )}

            {tutorialState === 'feeding' && (
              <div className="mt-6 text-white/70 animate-pulse">Feeding...</div>
            )}
          </div>

          {showButton && tutorial.action !== 'feed' && (
            <div className="p-6">
              <button onClick={onAction} className="w-full py-4 bg-white rounded-full text-purple-600 font-bold">
                {tutorial.action === 'finish' ? 'Start Playing!' : 'Got it!'}
              </button>
            </div>
          )}

          <div className="flex justify-center gap-2 pb-6">
            {TUTORIAL_STEPS.map((_, i) => (
              <div key={i} className={`w-2 h-2 rounded-full ${i === step ? 'bg-white' : 'bg-white/30'}`} />
            ))}
          </div>
        </div>
      );
    };

    // Main Menu Screen
    const MainMenu = ({ petState, pet, onPlay, onPets, onShop, onGames, onSettings, onCollectGems, canCollect, coins, gems, loginStreak, streakReward, streakClaimed, onClaimStreak, dailyEvent }) => (
      <div className="h-full bg-gradient-to-b from-indigo-900 to-purple-900 flex flex-col">
        <div className="p-4 flex justify-between items-center">
          <CurrencyDisplay coins={coins} gems={gems} />
          <button onClick={onSettings} className="glass rounded-full p-2 text-white hover:bg-white/20 transition-colors">
            <span className="text-xl">⚙️</span>
          </button>
        </div>

        {/* Phase 2: Daily Event Banner */}
        {dailyEvent && (
          <div className="px-4 pb-2">
            <DailyEventBanner event={dailyEvent} />
          </div>
        )}

        {/* Phase 2: Login Streak Banner */}
        {loginStreak > 0 && streakReward && (
          <div className="px-4 pb-2">
            <LoginStreakBanner
              streak={loginStreak}
              reward={streakReward}
              claimed={streakClaimed}
              onClaim={onClaimStreak}
            />
          </div>
        )}

        <div className="flex-1 flex flex-col items-center justify-center p-6">
          <PetDisplay pet={pet} petState={petState} />

          {canCollect && (
            <button onClick={onCollectGems} className="glass rounded-full px-6 py-3 mt-4 text-yellow-400 font-bold animate-pulse-custom flex items-center gap-2">
              <span className="text-xl">💎</span> Collect Daily Gems!
            </button>
          )}
        </div>

        <div className="p-6 space-y-3">
          <button onClick={onPlay} className="w-full py-4 bg-gradient-to-r from-green-400 to-emerald-500 rounded-2xl text-white font-bold text-lg flex items-center justify-center gap-2">
            <span>🍎</span> Feed & Play
          </button>
          <div className="flex gap-3">
            <button onClick={onPets} className="flex-1 py-4 glass rounded-2xl text-white font-bold flex items-center justify-center gap-2">
              <span>🐾</span> My Pets
            </button>
            <button onClick={onShop} className="flex-1 py-4 glass rounded-2xl text-white font-bold flex items-center justify-center gap-2">
              <span>🛒</span> Shop
            </button>
          </div>
          <button onClick={onGames} className="w-full py-4 bg-gradient-to-r from-purple-500 to-pink-500 rounded-2xl text-white font-bold text-lg flex items-center justify-center gap-2">
            <span>🎮</span> Mini-Games
          </button>
        </div>
      </div>
    );

    // Pet Care Screen (Main gameplay)
    const PetCareScreen = ({ state, update, onBack }) => {
      const [reaction, setReaction] = useState(null);
      const [levelUp, setLevelUp] = useState(null);
      const [overfeedWarning, setOverfeedWarning] = useState(null);

      const petState = state.petStates[state.activePetId];
      const pet = PETS[state.activePetId];
      const modeConfig = MODE_CONFIG[state.gameMode || 'casual'];

      // Get food from extended foods if available
      const getFood = (foodId) => EXTENDED_FOODS[foodId] || FOODS[foodId];

      const feedPet = (foodId) => {
        const food = getFood(foodId);
        const count = state.inventory[foodId] || 0;
        if (count <= 0) return;

        // Check stomach capacity (WEB-051)
        const stomachCapacity = petState.stomachCapacity || getStomachCapacity(petState.level);
        const stomachCurrent = petState.stomachCurrent || 0;
        const foodSize = (food.hunger || 10) * 0.5;
        const newStomach = stomachCurrent + foodSize;

        // Block feeding if completely full in Classic mode
        if (modeConfig.feedingLimitEnabled && stomachCurrent >= stomachCapacity) {
          setOverfeedWarning({ type: 'full', message: "Tummy is completely full! Wait for digestion." });
          return;
        }

        // Warn if approaching overfeed in Classic mode
        const isOverfeed = newStomach > stomachCapacity * STOMACH_CONFIG.overfeedThreshold;
        if (modeConfig.feedingLimitEnabled && isOverfeed && !overfeedWarning) {
          setOverfeedWarning({ type: 'warning', message: "Getting too full! May cause tummy ache.", foodId });
          return;
        }

        // Clear warning if proceeding
        setOverfeedWarning(null);

        const affinity = food.affinities?.[state.activePetId] || 'neutral';
        const moodTier = getMoodTier(petState.mood);
        const happinessTier = getHappinessTier(petState.happiness || 70);
        let affinityMult = AFFINITY_MULTIPLIERS[affinity];

        let bonusGems = 0;
        let abilityTriggered = null;

        // Apply abilities
        if (pet.ability.type === AbilityType.XPBoost) {
          affinityMult *= pet.ability.mod;
          abilityTriggered = pet.ability.name;
        }
        if (pet.ability.type === AbilityType.LuckyFeeder && affinity === 'loved') {
          affinityMult = pet.ability.mod;
          abilityTriggered = pet.ability.name;
        }
        if (pet.ability.type === AbilityType.GemFinder && Math.random() < pet.ability.mod) {
          bonusGems = 1;
          abilityTriggered = pet.ability.name;
        }

        // Apply happiness multiplier (WEB-037)
        const happinessXpMult = happinessTier.xpMult;

        // Phase 2: Apply daily event multipliers
        const dailyEvent = state.dailyEvent;
        const eventXpMult = dailyEvent?.xpMultiplier || 1;
        const eventMoodBoost = dailyEvent?.moodBoost || 0;
        const eventHungerBoost = dailyEvent?.hungerBoost || 0;

        // Calculate XP with all multipliers
        let xpGained = Math.round(food.xp * affinityMult * moodTier.mult * happinessXpMult * eventXpMult);

        // Overfeed penalty in Classic mode
        if (modeConfig.feedingLimitEnabled && isOverfeed) {
          xpGained = Math.floor(xpGained * 0.5);
        }

        let moodChange = (food.mood || 0) + eventMoodBoost;
        if (affinity === 'loved') moodChange += 3;
        else if (affinity === 'liked') moodChange += 1;
        else if (affinity === 'disliked') {
          moodChange -= 2;
          if (pet.ability.type === AbilityType.NegativeResist) {
            moodChange = Math.round(moodChange * pet.ability.mod);
          }
        }

        // Overfeed mood penalty
        if (modeConfig.feedingLimitEnabled && isOverfeed) {
          moodChange += STOMACH_CONFIG.overfeedMoodPenalty;
        }

        // Weight changes (WEB-038)
        const calories = food.calories || Math.round((food.hunger || 10) * 0.8);
        const currentWeight = petState.weight || 100;
        let weightChange = 0;
        if (calories > 12) weightChange = 1;
        else if (calories < 6) weightChange = -0.5;
        const newWeight = Math.max(50, Math.min(150, currentWeight + weightChange));

        // Happiness update
        let happinessChange = 0;
        if (food.isHealthy) happinessChange += 2;
        if (!food.isHealthy && food.sugarContent > 5) happinessChange -= 1;
        if (affinity === 'loved') happinessChange += 3;
        else if (affinity === 'disliked') happinessChange -= 2;
        const newHappiness = Math.max(0, Math.min(100, (petState.happiness || 70) + happinessChange));

        let newXp = petState.xp + xpGained;
        let newLevel = petState.level;
        let leveledUp = false;
        let evolved = false;
        let newStage = petState.stage;
        let coinReward = 0;
        let gemReward = bonusGems;

        // Phase 3: Track evolution branch
        let newEvolutionBranch = petState.evolutionBranch || 'good';

        while (newXp >= xpForLevel(newLevel) && newLevel < 20) {
          newXp -= xpForLevel(newLevel);
          newLevel++;
          leveledUp = true;
          coinReward += LEVEL_UP_COINS;
          gemReward += LEVEL_UP_GEMS;
          const updatedStage = getGrowthStage(newLevel);
          if (updatedStage !== newStage) {
            evolved = true;
            // Phase 3: Determine evolution branch based on care score
            newEvolutionBranch = getEvolutionBranch(petState, state.gameMode);
            const branchSuffix = state.gameMode === 'classic' && newEvolutionBranch !== 'good'
              ? `_${newEvolutionBranch}`
              : '';
            newStage = updatedStage + branchSuffix;
          }
        }

        // Update stomach capacity on level up
        const newStomachCapacity = leveledUp ? getStomachCapacity(newLevel) : stomachCapacity;

        const newPetState = {
          ...petState,
          xp: newXp,
          level: newLevel,
          hunger: Math.min(100, petState.hunger + (food.hunger || 10) + eventHungerBoost),
          mood: Math.max(0, Math.min(100, petState.mood + moodChange)),
          stage: newStage,
          totalFeedings: petState.totalFeedings + 1,
          totalXpEarned: petState.totalXpEarned + xpGained,
          // Hybrid mode updates
          happiness: newHappiness,
          weight: newWeight,
          stomachCurrent: Math.min(newStomach, newStomachCapacity),
          stomachCapacity: newStomachCapacity,
          lastFeedTime: Date.now(),
          // Phase 3: Evolution branch
          evolutionBranch: newEvolutionBranch,
        };

        const newInventory = { ...state.inventory, [foodId]: count - 1 };

        update({
          petStates: { ...state.petStates, [state.activePetId]: newPetState },
          inventory: newInventory,
          coins: state.coins + coinReward,
          gems: state.gems + gemReward,
        });

        setReaction({ affinity, xpGained, bonusGems: gemReward, abilityTriggered, isOverfeed });

        // Phase 4: Play sound and vibration
        AudioManager.playSfx('feed');
        VibrationManager.vibratePreset('feed');
        if (leveledUp) {
          setTimeout(() => {
            AudioManager.playSfx('levelUp');
            VibrationManager.vibratePreset('levelUp');
          }, 500);
        }
        if (gemReward > 0) {
          AudioManager.playSfx('coin');
        }

        if (leveledUp) {
          setTimeout(() => setLevelUp({ level: newLevel, evolved, newStage }), 2000);
        }
      };

      const xpNeeded = xpForLevel(petState.level);
      const moodTier = getMoodTier(petState.mood);
      const stomachCapacity = petState.stomachCapacity || getStomachCapacity(petState.level);
      const stomachCurrent = petState.stomachCurrent || 0;

      return (
        <div className="h-full bg-gradient-to-b from-indigo-900 to-purple-900 flex flex-col">
          {/* Header */}
          <div className="p-4 flex items-center justify-between">
            <button onClick={onBack} className="glass rounded-full p-2 text-white">
              <span className="text-xl">←</span>
            </button>
            <div className="flex items-center gap-2">
              {state.gameMode && <ModeBadge mode={state.gameMode} />}
              <CurrencyDisplay coins={state.coins} gems={state.gems} />
            </div>
          </div>

          {/* Pet */}
          <div className="flex-1 flex flex-col items-center justify-center">
            <PetDisplay pet={pet} petState={petState} showStats={false} />
            {/* Weight indicator under pet */}
            <div className="mt-2 w-48">
              <WeightIndicator weight={petState.weight || 100} />
            </div>
          </div>

          {/* Stats - Now includes hybrid mode meters */}
          <div className="px-6 space-y-2" id="stats">
            <div className="flex items-center gap-2 text-white">
              <span className="font-bold">{pet.name}</span>
              <span className="text-white/50">Lv.{petState.level}</span>
              <span className="ml-auto">{moodTier.icon} {moodTier.label}</span>
            </div>
            <ProgressBar value={petState.xp} max={xpNeeded} color="#fbbf24" label="XP" icon="⭐" />
            <ProgressBar value={petState.hunger} max={100} color="#fb923c" label="Hunger" icon="🍖" />
            <ProgressBar value={petState.mood} max={100} color="#f472b6" label="Mood" icon="💕" />
            {/* Hybrid Mode meters */}
            <HappinessMeter value={petState.happiness || 70} />
            <StomachMeter current={stomachCurrent} capacity={stomachCapacity} />
          </div>

          {/* Poop/Cleaning (Phase 2) */}
          <div className="px-4">
            <PoopIndicator
              count={petState.poopCount || 0}
              onClean={() => {
                if ((petState.poopCount || 0) <= 0) return;
                const newPetState = {
                  ...petState,
                  poopCount: petState.poopCount - 1,
                  cleanlinessScore: Math.min(100, (petState.cleanlinessScore || 100) + 10),
                  happiness: Math.min(100, (petState.happiness || 70) + 2)
                };
                update({
                  petStates: { ...state.petStates, [state.activePetId]: newPetState }
                });
              }}
            />
          </div>

          {/* Phase 3: Sickness Indicator */}
          {petState.isSick && (
            <div className="px-4">
              <SicknessIndicator
                isSick={petState.isSick}
                onGiveMedicine={() => {
                  const vitamins = state.inventory.vitamins || 0;
                  if (vitamins <= 0) return;
                  const newPetState = {
                    ...petState,
                    isSick: false,
                    sicknessStartTime: null,
                    mood: Math.min(100, petState.mood + 10),
                    happiness: Math.min(100, (petState.happiness || 70) + 5)
                  };
                  update({
                    petStates: { ...state.petStates, [state.activePetId]: newPetState },
                    inventory: { ...state.inventory, vitamins: vitamins - 1 }
                  });
                }}
              />
            </div>
          )}

          {/* Phase 3: Care Mistake Warning (Classic Mode) */}
          {state.gameMode === 'classic' && (
            <div className="px-4">
              <CareMistakeWarning
                mistakes={petState.careMistakes || 0}
                threshold={DEATH_CONFIG.warningThreshold}
              />
            </div>
          )}

          {/* Food bag */}
          <div className="p-4" id="food-bag">
            <div className="text-white/70 text-sm mb-2">Food Bag</div>
            <div className="grid grid-cols-5 gap-2">
              {Object.entries(state.inventory).filter(([_, c]) => c > 0).map(([foodId, count]) => {
                const food = getFood(foodId);
                return food ? (
                  <FoodItem key={foodId} food={food} count={count} onClick={() => feedPet(foodId)} />
                ) : null;
              })}
              {Object.values(state.inventory).every(c => !c || c <= 0) && (
                <div className="col-span-5 text-center text-white/50 py-4">No food! Visit the shop.</div>
              )}
            </div>
          </div>

          {/* Reaction popup */}
          {reaction && <ReactionPopup reaction={reaction} onClose={() => setReaction(null)} />}

          {/* Level up modal */}
          {levelUp && <LevelUpModal {...levelUp} pet={pet} onClose={() => setLevelUp(null)} />}

          {/* Overfeed warning modal */}
          {overfeedWarning && (
            <Modal onClose={() => setOverfeedWarning(null)}>
              <div className="text-center">
                <div className="text-5xl mb-4">{overfeedWarning.type === 'full' ? '🤢' : '⚠️'}</div>
                <h3 className="text-xl font-bold text-white mb-2">
                  {overfeedWarning.type === 'full' ? 'Tummy Full!' : 'Warning!'}
                </h3>
                <p className="text-white/70 mb-4">{overfeedWarning.message}</p>
                {overfeedWarning.type === 'warning' && (
                  <div className="flex gap-3">
                    <button
                      onClick={() => setOverfeedWarning(null)}
                      className="flex-1 py-3 glass rounded-xl text-white font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      onClick={() => {
                        setOverfeedWarning(null);
                        feedPet(overfeedWarning.foodId);
                      }}
                      className="flex-1 py-3 bg-yellow-500 rounded-xl text-white font-bold"
                    >
                      Feed Anyway
                    </button>
                  </div>
                )}
                {overfeedWarning.type === 'full' && (
                  <button
                    onClick={() => setOverfeedWarning(null)}
                    className="w-full py-3 glass rounded-xl text-white font-bold"
                  >
                    OK
                  </button>
                )}
              </div>
            </Modal>
          )}
        </div>
      );
    };

    // Pet Selector Screen
    const PetSelectorScreen = ({ state, update, onBack, onUnlock }) => {
      const [selectedPet, setSelectedPet] = useState(null);
      const [showUnlock, setShowUnlock] = useState(null);

      const handleSelect = (petId) => {
        if (state.unlockedPets[petId]) {
          // Switch to this pet
          let petStates = { ...state.petStates };
          if (!petStates[petId]) {
            petStates[petId] = createDefaultPetState(petId);
          }
          update({ activePetId: petId, petStates, screen: 'pet_care' });
        } else {
          setShowUnlock(petId);
        }
      };

      const handleUnlock = (petId) => {
        const pet = PETS[petId];
        if (state.gems >= pet.gemCost) {
          const newPetState = createDefaultPetState(petId);
          update({
            unlockedPets: { ...state.unlockedPets, [petId]: true },
            petStates: { ...state.petStates, [petId]: newPetState },
            gems: state.gems - pet.gemCost,
          });
          setShowUnlock(null);
          onUnlock(pet);
        }
      };

      const allPets = Object.values(PETS).sort((a, b) => a.gemCost - b.gemCost);

      return (
        <div className="h-full bg-gradient-to-b from-indigo-900 to-purple-900 flex flex-col">
          <div className="p-4 flex items-center gap-4">
            <button onClick={onBack} className="glass rounded-full p-2 text-white">
              <span className="text-xl">←</span>
            </button>
            <h2 className="text-xl font-bold text-white flex-1">My Pets</h2>
            <CurrencyDisplay coins={state.coins} gems={state.gems} />
          </div>

          <div className="flex-1 overflow-auto p-4 space-y-3">
            {allPets.map(pet => {
              const isUnlocked = state.unlockedPets[pet.id];
              const petState = state.petStates[pet.id];
              const isActive = state.activePetId === pet.id;

              return (
                <button
                  key={pet.id}
                  onClick={() => handleSelect(pet.id)}
                  className={`w-full glass rounded-2xl p-4 flex items-center gap-4 transition ${isActive ? 'ring-2 ring-green-400' : ''} ${!isUnlocked ? 'opacity-70' : ''}`}
                >
                  <div className="relative">
                    <span className="text-5xl" style={{ filter: isUnlocked ? 'none' : 'grayscale(1) brightness(0.5)' }}>
                      {pet.emoji}
                    </span>
                    {!isUnlocked && <span className="absolute inset-0 flex items-center justify-center text-2xl">🔒</span>}
                  </div>
                  <div className="flex-1 text-left">
                    <div className="text-white font-bold flex items-center gap-2">
                      {pet.name}
                      {isActive && <span className="text-xs bg-green-500 px-2 py-0.5 rounded">Active</span>}
                    </div>
                    {isUnlocked && petState ? (
                      <div className="text-white/70 text-sm">Lv.{petState.level} • {petState.stage}</div>
                    ) : (
                      <div className="text-yellow-400 text-sm flex items-center gap-1">
                        <span>💎</span> {pet.gemCost} gems to unlock
                      </div>
                    )}
                    <div className="text-purple-300 text-xs mt-1">{pet.ability.name}</div>
                  </div>
                </button>
              );
            })}
          </div>

          {/* Unlock confirmation modal */}
          {showUnlock && (
            <Modal onClose={() => setShowUnlock(null)}>
              <div className="text-center">
                <span className="text-6xl block mb-4">{PETS[showUnlock].emoji}</span>
                <h3 className="text-xl font-bold text-white mb-2">Unlock {PETS[showUnlock].name}?</h3>
                <p className="text-white/70 mb-4">{PETS[showUnlock].personality}</p>
                <div className="glass rounded-xl p-3 mb-4">
                  <div className="text-purple-300 text-sm">{PETS[showUnlock].ability.name}</div>
                  <div className="text-white/70 text-xs">{PETS[showUnlock].ability.desc}</div>
                </div>
                <div className="flex items-center justify-center gap-2 mb-4">
                  <span className="text-2xl">💎</span>
                  <span className="text-2xl font-bold text-white">{PETS[showUnlock].gemCost}</span>
                  <span className="text-white/50">/ {state.gems} owned</span>
                </div>
                <div className="flex gap-3">
                  <button onClick={() => setShowUnlock(null)} className="flex-1 py-3 glass rounded-xl text-white">
                    Cancel
                  </button>
                  <button
                    onClick={() => handleUnlock(showUnlock)}
                    disabled={state.gems < PETS[showUnlock].gemCost}
                    className={`flex-1 py-3 rounded-xl font-bold ${state.gems >= PETS[showUnlock].gemCost ? 'bg-gradient-to-r from-purple-500 to-pink-500 text-white' : 'bg-gray-600 text-gray-400'}`}
                  >
                    Unlock!
                  </button>
                </div>
              </div>
            </Modal>
          )}
        </div>
      );
    };

    // Shop Screen
    const ShopScreen = ({ state, update, onBack }) => {
      const [tab, setTab] = useState('coins');
      const [category, setCategory] = useState(null);
      const [purchased, setPurchased] = useState(null);

      // Phase 2: Apply sale discount from daily event
      const saleDiscount = state.dailyEvent?.discount || 0;

      const buyFood = (foodId, useGems = false) => {
        const food = EXTENDED_FOODS[foodId] || FOODS[foodId];
        if (useGems && food.gemCost) {
          if (state.gems >= food.gemCost) {
            update({
              inventory: { ...state.inventory, [foodId]: (state.inventory[foodId] || 0) + 1 },
              gems: state.gems - food.gemCost,
            });
            setPurchased(food);
          }
        } else {
          const finalCost = Math.floor(food.cost * (1 - saleDiscount));
          if (state.coins >= finalCost) {
            update({
              inventory: { ...state.inventory, [foodId]: (state.inventory[foodId] || 0) + 1 },
              coins: state.coins - finalCost,
            });
            setPurchased(food);
          }
        }
      };

      // Use extended foods catalog
      const allFoods = Object.values(EXTENDED_FOODS);
      let coinFoods = allFoods.filter(f => !f.gemCost).sort((a, b) => a.cost - b.cost);
      let gemFoods = allFoods.filter(f => f.gemCost);

      // Phase 2: Apply category filter
      if (category) {
        coinFoods = coinFoods.filter(f => getShopCategory(f) === category);
        gemFoods = gemFoods.filter(f => getShopCategory(f) === category);
      }

      return (
        <div className="h-full bg-gradient-to-b from-indigo-900 to-purple-900 flex flex-col">
          <div className="p-4 flex items-center gap-4">
            <button onClick={onBack} className="glass rounded-full p-2 text-white">
              <span className="text-xl">←</span>
            </button>
            <h2 className="text-xl font-bold text-white flex-1">Shop</h2>
            <CurrencyDisplay coins={state.coins} gems={state.gems} />
          </div>

          {/* Sale Banner */}
          {saleDiscount > 0 && (
            <div className="mx-4 mb-2 bg-gradient-to-r from-pink-500/30 to-red-500/30 rounded-xl p-2 text-center border border-pink-400/30">
              <span className="text-pink-200 font-bold">🏷️ {Math.round(saleDiscount * 100)}% OFF SALE!</span>
            </div>
          )}

          {/* Tabs */}
          <div className="px-4 flex gap-2">
            <button
              onClick={() => setTab('coins')}
              className={`flex-1 py-2 rounded-xl font-bold transition ${tab === 'coins' ? 'bg-yellow-500 text-white' : 'glass text-white/70'}`}
            >
              🪙 Coins
            </button>
            <button
              onClick={() => setTab('gems')}
              className={`flex-1 py-2 rounded-xl font-bold transition ${tab === 'gems' ? 'bg-purple-500 text-white' : 'glass text-white/70'}`}
            >
              💎 Premium
            </button>
          </div>

          {/* Category Filter */}
          <div className="px-4 pt-2">
            <ShopCategoryTabs activeCategory={category} onSelect={setCategory} />
          </div>

          <div className="flex-1 overflow-auto p-4">
            <div className="grid grid-cols-3 gap-3">
              {(tab === 'coins' ? coinFoods : gemFoods).map(food => {
                const finalCost = Math.floor(food.cost * (1 - saleDiscount));
                const canAfford = tab === 'gems' ? state.gems >= food.gemCost : state.coins >= finalCost;
                return (
                  <button
                    key={food.id}
                    onClick={() => buyFood(food.id, tab === 'gems')}
                    disabled={!canAfford}
                    className={`glass rounded-xl p-3 flex flex-col items-center transition ${canAfford ? 'hover:bg-white/20' : 'opacity-50'}`}
                    style={{ borderColor: RARITY_COLORS[food.rarity], borderWidth: 2 }}
                  >
                    <span className="text-4xl">{food.emoji}</span>
                    <span className="text-white text-sm mt-1">{food.name}</span>
                    <span className="text-white/70 text-xs capitalize">{food.rarity}</span>
                    <div className="flex items-center gap-1 mt-1">
                      <span>{tab === 'gems' ? '💎' : '🪙'}</span>
                      {tab === 'gems' ? (
                        <span className="text-white font-bold">{food.gemCost}</span>
                      ) : saleDiscount > 0 ? (
                        <>
                          <span className="text-white/50 line-through text-xs">{food.cost}</span>
                          <span className="text-green-400 font-bold">{finalCost}</span>
                        </>
                      ) : (
                        <span className="text-white font-bold">{food.cost}</span>
                      )}
                    </div>
                    <div className="text-white/50 text-xs mt-1">
                      +{food.hunger} hunger • +{food.xp} XP
                    </div>
                  </button>
                );
              })}
            </div>
          </div>

          {/* Purchase popup */}
          {purchased && (
            <div className="fixed inset-0 flex items-center justify-center pointer-events-none z-30">
              <div className="animate-bounce-custom text-center" onAnimationEnd={() => setPurchased(null)}>
                <div className="text-6xl">{purchased.emoji}</div>
                <div className="text-green-400 font-bold mt-2">Purchased!</div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // Gem income modal
    const GemIncomeModal = ({ amount, onClose }) => (
      <Modal onClose={onClose}>
        <Confetti count={30} />
        <div className="text-center">
          <div className="text-6xl mb-4 animate-sparkle">💎</div>
          <h2 className="text-xl font-bold text-white mb-2">Daily Gems Collected!</h2>
          <div className="text-4xl font-bold text-purple-400 mb-4">+{amount} 💎</div>
          <p className="text-white/70 text-sm mb-4">Come back tomorrow for more!</p>
          <button onClick={onClose} className="w-full py-3 bg-gradient-to-r from-purple-500 to-pink-500 rounded-xl text-white font-bold">
            Awesome!
          </button>
        </div>
      </Modal>
    );

    // ============================================================
    // MINI-GAMES (Section 9)
    // ============================================================

    // Snack Catch Mini-Game
    const SnackCatchGame = ({ pet, onComplete, onBack }) => {
      const [gameState, setGameState] = useState('ready'); // 'ready' | 'playing' | 'finished'
      const [score, setScore] = useState(0);
      const [timeLeft, setTimeLeft] = useState(60);
      const [basketX, setBasketX] = useState(50);
      const [fallingItems, setFallingItems] = useState([]);
      const [combo, setCombo] = useState(0);
      const [effects, setEffects] = useState([]);
      const gameRef = useRef(null);
      const itemIdRef = useRef(0);

      // Determine good/bad foods based on pet preferences
      const getFoodScore = (foodId) => {
        const food = FOODS[foodId];
        const affinity = food.affinities[pet.id];
        if (affinity === 'loved') return { points: 20, type: 'loved' };
        if (affinity === 'liked') return { points: 10, type: 'good' };
        if (affinity === 'neutral') return { points: 5, type: 'neutral' };
        return { points: -15, type: 'bad' };
      };

      // Start game
      const startGame = () => {
        setGameState('playing');
        setScore(0);
        setTimeLeft(60);
        setCombo(0);
        setFallingItems([]);
        setEffects([]);
      };

      // Handle basket movement
      const handleMove = (e) => {
        if (gameState !== 'playing' || !gameRef.current) return;
        const rect = gameRef.current.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const x = ((clientX - rect.left) / rect.width) * 100;
        setBasketX(Math.max(10, Math.min(90, x)));
      };

      // Game timer
      useEffect(() => {
        if (gameState !== 'playing') return;
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              setGameState('finished');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, [gameState]);

      // Spawn falling items
      useEffect(() => {
        if (gameState !== 'playing') return;
        const spawnInterval = setInterval(() => {
          const foodIds = Object.keys(FOODS);
          const randomFood = foodIds[Math.floor(Math.random() * foodIds.length)];
          const newItem = {
            id: itemIdRef.current++,
            foodId: randomFood,
            x: 10 + Math.random() * 80,
            y: -10,
            speed: 1.5 + Math.random() * 1.5,
          };
          setFallingItems(prev => [...prev, newItem]);
        }, 800);
        return () => clearInterval(spawnInterval);
      }, [gameState]);

      // Move falling items and check collisions
      useEffect(() => {
        if (gameState !== 'playing') return;
        const moveInterval = setInterval(() => {
          setFallingItems(prev => {
            const updated = [];
            prev.forEach(item => {
              const newY = item.y + item.speed;

              // Check if caught by basket
              if (newY >= 75 && newY <= 90 && Math.abs(item.x - basketX) < 15) {
                const { points, type } = getFoodScore(item.foodId);

                if (type === 'bad') {
                  setCombo(0);
                  setScore(s => Math.max(0, s + points));
                  setEffects(e => [...e, { id: Date.now(), x: item.x, text: points, color: '#f87171' }]);
                } else {
                  const comboBonus = Math.min(combo * 2, 10);
                  const totalPoints = points + comboBonus;
                  setCombo(c => c + 1);
                  setScore(s => s + totalPoints);
                  const color = type === 'loved' ? '#fbbf24' : type === 'good' ? '#4ade80' : '#60a5fa';
                  setEffects(e => [...e, { id: Date.now(), x: item.x, text: `+${totalPoints}`, color }]);
                }
              } else if (newY < 100) {
                updated.push({ ...item, y: newY });
              } else {
                // Missed - reset combo
                setCombo(0);
              }
            });
            return updated;
          });

          // Clean up effects
          setEffects(prev => prev.filter(e => Date.now() - e.id < 1000));
        }, 50);
        return () => clearInterval(moveInterval);
      }, [gameState, basketX, combo]);

      // Calculate tier and rewards
      const getTier = () => {
        if (score >= 300) return { tier: 'Rainbow', emoji: '🌈', coins: 15, xp: 5, color: '#f472b6' };
        if (score >= 200) return { tier: 'Gold', emoji: '🥇', coins: 10, xp: 5, color: '#fbbf24' };
        if (score >= 100) return { tier: 'Silver', emoji: '🥈', coins: 6, xp: 4, color: '#9ca3af' };
        return { tier: 'Bronze', emoji: '🥉', coins: 3, xp: 3, color: '#cd7f32' };
      };

      const handleFinish = () => {
        const rewards = getTier();
        onComplete({ score, ...rewards });
      };

      if (gameState === 'ready') {
        return (
          <div className="h-full bg-gradient-to-b from-blue-900 to-purple-900 flex flex-col items-center justify-center p-6">
            <button onClick={onBack} className="absolute top-4 left-4 glass rounded-full p-2 text-white">←</button>
            <div className="text-6xl mb-4">🧺</div>
            <h2 className="text-2xl font-bold text-white mb-2">Snack Catch!</h2>
            <p className="text-white/70 text-center mb-4">
              Catch {pet.name}'s favorite foods!<br/>
              Avoid foods they dislike!
            </p>
            <div className="glass rounded-xl p-4 mb-6 text-sm text-white/80">
              <div className="flex items-center gap-2 mb-1">🤩 Loved: +20 pts</div>
              <div className="flex items-center gap-2 mb-1">😋 Liked: +10 pts</div>
              <div className="flex items-center gap-2 mb-1">😐 Neutral: +5 pts</div>
              <div className="flex items-center gap-2">😖 Disliked: -15 pts</div>
              <div className="mt-2 text-yellow-400">Combo bonus: +2 per streak!</div>
            </div>
            <button onClick={startGame} className="px-8 py-4 bg-gradient-to-r from-green-400 to-emerald-500 rounded-full text-white font-bold text-lg">
              Start Game!
            </button>
          </div>
        );
      }

      if (gameState === 'finished') {
        const { tier, emoji, coins, xp, color } = getTier();
        return (
          <div className="h-full bg-gradient-to-b from-blue-900 to-purple-900 flex flex-col items-center justify-center p-6">
            <Confetti count={score >= 200 ? 50 : 20} />
            <div className="text-6xl mb-4">{emoji}</div>
            <h2 className="text-2xl font-bold text-white mb-2">{tier} Tier!</h2>
            <div className="text-5xl font-bold mb-4" style={{ color }}>{score} pts</div>
            <div className="glass rounded-xl p-4 mb-6 text-white">
              <div className="flex justify-between gap-8">
                <span>🪙 Coins:</span>
                <span className="font-bold">+{coins}</span>
              </div>
              <div className="flex justify-between gap-8">
                <span>⭐ XP:</span>
                <span className="font-bold">+{xp}</span>
              </div>
            </div>
            <div className="flex gap-3">
              <button onClick={startGame} className="px-6 py-3 glass rounded-xl text-white font-bold">
                Play Again
              </button>
              <button onClick={handleFinish} className="px-6 py-3 bg-gradient-to-r from-green-400 to-emerald-500 rounded-xl text-white font-bold">
                Collect Rewards
              </button>
            </div>
          </div>
        );
      }

      return (
        <div
          ref={gameRef}
          className="h-full bg-gradient-to-b from-sky-400 to-blue-600 relative overflow-hidden touch-none"
          onMouseMove={handleMove}
          onTouchMove={handleMove}
        >
          {/* HUD */}
          <div className="absolute top-0 left-0 right-0 p-4 flex justify-between items-center z-10">
            <div className="glass rounded-full px-4 py-2 text-white font-bold">
              ⏱️ {timeLeft}s
            </div>
            <div className="glass rounded-full px-4 py-2 text-white font-bold">
              🏆 {score}
            </div>
            {combo > 1 && (
              <div className="glass rounded-full px-4 py-2 text-yellow-400 font-bold animate-pulse">
                🔥 x{combo}
              </div>
            )}
          </div>

          {/* Falling items */}
          {fallingItems.map(item => (
            <div
              key={item.id}
              className="absolute text-3xl transition-none"
              style={{ left: `${item.x}%`, top: `${item.y}%`, transform: 'translate(-50%, -50%)' }}
            >
              {FOODS[item.foodId].emoji}
            </div>
          ))}

          {/* Score effects */}
          {effects.map(effect => (
            <div
              key={effect.id}
              className="absolute text-xl font-bold pointer-events-none animate-bounce"
              style={{
                left: `${effect.x}%`,
                top: '70%',
                color: effect.color,
                animation: 'floatUp 1s ease-out forwards'
              }}
            >
              {effect.text}
            </div>
          ))}

          {/* Basket */}
          <div
            className="absolute bottom-16 text-5xl transition-all duration-75"
            style={{ left: `${basketX}%`, transform: 'translateX(-50%)' }}
          >
            🧺
          </div>

          {/* Ground */}
          <div className="absolute bottom-0 left-0 right-0 h-12 bg-green-800" />
        </div>
      );
    };

    // ============================================================
    // MEMORY MATCH MINI-GAME (WEB-081)
    // ============================================================

    const MemoryMatchGame = ({ pet, onComplete, onBack }) => {
      const [gameState, setGameState] = useState('ready'); // 'ready' | 'playing' | 'finished'
      const [cards, setCards] = useState([]);
      const [flippedIndices, setFlippedIndices] = useState([]);
      const [matchedPairs, setMatchedPairs] = useState([]);
      const [moves, setMoves] = useState(0);
      const [canFlip, setCanFlip] = useState(true);
      const [showPeek, setShowPeek] = useState(false);
      const hasWhispAbility = pet.id === 'whisp';
      const hasLuxeAbility = pet.id === 'luxe';
      const [undoUsed, setUndoUsed] = useState(false);

      // Food emojis for cards
      const foodEmojis = ['🍎', '🍌', '🥕', '🍪', '🍇', '🌮', '🎂', '⭐'];

      const initGame = () => {
        // Create pairs
        const pairs = [...foodEmojis, ...foodEmojis];
        // Shuffle
        const shuffled = pairs.sort(() => Math.random() - 0.5).map((emoji, i) => ({
          id: i, emoji, isFlipped: false, isMatched: false
        }));
        setCards(shuffled);
        setFlippedIndices([]);
        setMatchedPairs([]);
        setMoves(0);
        setCanFlip(true);
        setUndoUsed(false);
        setGameState('playing');

        // Whisp ability: peek at start
        if (hasWhispAbility) {
          setShowPeek(true);
          setTimeout(() => setShowPeek(false), 2000);
        }

        AudioManager.playSfx('levelUp');
      };

      const handleCardClick = (index) => {
        if (!canFlip || gameState !== 'playing') return;
        if (flippedIndices.includes(index)) return;
        if (matchedPairs.includes(cards[index].emoji)) return;

        AudioManager.playSfx('tap');
        VibrationManager.vibratePreset('tap');

        const newFlipped = [...flippedIndices, index];
        setFlippedIndices(newFlipped);

        if (newFlipped.length === 2) {
          setMoves(m => m + 1);
          setCanFlip(false);

          const [first, second] = newFlipped;
          if (cards[first].emoji === cards[second].emoji) {
            // Match found!
            AudioManager.playSfx('success');
            VibrationManager.vibratePreset('success');
            setMatchedPairs(prev => [...prev, cards[first].emoji]);
            setFlippedIndices([]);
            setCanFlip(true);

            // Check win condition
            if (matchedPairs.length + 1 === 8) {
              setTimeout(() => finishGame(), 500);
            }
          } else {
            // No match - flip back after delay
            setTimeout(() => {
              setFlippedIndices([]);
              setCanFlip(true);
            }, 1000);
          }
        }
      };

      const handleUndo = () => {
        if (!hasLuxeAbility || undoUsed || flippedIndices.length === 0) return;
        setUndoUsed(true);
        setFlippedIndices([]);
        setCanFlip(true);
        AudioManager.playSfx('tap');
      };

      const finishGame = () => {
        setGameState('finished');
        AudioManager.playSfx('levelUp');
        VibrationManager.vibratePreset('levelUp');
      };

      const getRewards = () => {
        if (moves <= 12) return { coins: 100, gems: 3, tier: 'Perfect' };
        if (moves <= 18) return { coins: 75, gems: 2, tier: 'Great' };
        if (moves <= 24) return { coins: 50, gems: 1, tier: 'Good' };
        return { coins: 25, gems: 0, tier: 'Complete' };
      };

      const handleFinish = () => {
        const rewards = getRewards();
        onComplete(rewards);
      };

      if (gameState === 'ready') {
        return (
          <div className="h-full bg-gradient-to-b from-purple-900 to-indigo-900 flex flex-col items-center justify-center p-6">
            <div className="text-6xl mb-6">🧠</div>
            <h2 className="text-2xl font-bold text-white mb-4">Memory Match</h2>
            <p className="text-white/70 text-center mb-6">Find all matching pairs in the fewest moves!</p>
            {hasWhispAbility && (
              <div className="glass rounded-xl p-3 mb-4 text-center">
                <span className="text-yellow-300">⭐ Whisp's Peek: See all cards for 2 seconds!</span>
              </div>
            )}
            <button onClick={initGame} className="px-8 py-4 bg-gradient-to-r from-purple-500 to-pink-500 rounded-xl text-white font-bold text-lg">
              Start Game
            </button>
            <button onClick={onBack} className="mt-4 text-white/50">Back</button>
          </div>
        );
      }

      if (gameState === 'finished') {
        const rewards = getRewards();
        return (
          <div className="h-full bg-gradient-to-b from-purple-900 to-indigo-900 flex flex-col items-center justify-center p-6">
            <Confetti count={20} />
            <div className="text-6xl mb-4">🎉</div>
            <h2 className="text-2xl font-bold text-white mb-2">{rewards.tier}!</h2>
            <p className="text-white/70 mb-4">Completed in {moves} moves</p>
            <div className="glass rounded-xl p-4 mb-6 text-center">
              <div className="text-yellow-400 text-xl font-bold">+{rewards.coins} 🪙</div>
              {rewards.gems > 0 && <div className="text-purple-400 text-lg">+{rewards.gems} 💎</div>}
            </div>
            <button onClick={handleFinish} className="px-8 py-4 bg-gradient-to-r from-green-500 to-emerald-500 rounded-xl text-white font-bold">
              Collect Rewards
            </button>
          </div>
        );
      }

      return (
        <div className="h-full bg-gradient-to-b from-purple-900 to-indigo-900 flex flex-col">
          {/* Header */}
          <div className="p-4 flex items-center justify-between">
            <button onClick={onBack} className="glass rounded-full p-2 text-white">
              <span className="text-xl">←</span>
            </button>
            <div className="text-center">
              <div className="text-white text-sm">Moves: {moves}</div>
              <div className="text-yellow-300 text-sm">Pairs: {matchedPairs.length}/8</div>
            </div>
            {hasLuxeAbility && !undoUsed && flippedIndices.length > 0 && (
              <button onClick={handleUndo} className="glass rounded-full px-3 py-1 text-yellow-300 text-sm">
                ↩️ Undo
              </button>
            )}
          </div>

          {/* Game grid - 4x4 */}
          <div className="flex-1 p-4 flex items-center justify-center">
            <div className="grid grid-cols-4 gap-2">
              {cards.map((card, idx) => {
                const isFlipped = flippedIndices.includes(idx) || matchedPairs.includes(card.emoji) || showPeek;
                return (
                  <button
                    key={card.id}
                    onClick={() => handleCardClick(idx)}
                    className={`w-16 h-20 rounded-xl flex items-center justify-center text-3xl transition-all duration-300 transform
                      ${isFlipped ? 'bg-white rotate-y-0' : 'bg-gradient-to-br from-purple-500 to-pink-500'}
                      ${matchedPairs.includes(card.emoji) ? 'opacity-50 scale-95' : 'hover:scale-105'}
                    `}
                    style={{
                      transformStyle: 'preserve-3d',
                      transform: isFlipped ? 'rotateY(0deg)' : 'rotateY(180deg)'
                    }}
                    disabled={matchedPairs.includes(card.emoji)}
                  >
                    {isFlipped ? card.emoji : '❓'}
                  </button>
                );
              })}
            </div>
          </div>
        </div>
      );
    };

    // ============================================================
    // RHYTHM TAP MINI-GAME (WEB-083)
    // ============================================================

    const RhythmTapGame = ({ pet, onComplete, onBack }) => {
      const [gameState, setGameState] = useState('ready');
      const [score, setScore] = useState(0);
      const [combo, setCombo] = useState(0);
      const [maxCombo, setMaxCombo] = useState(0);
      const [notes, setNotes] = useState([]);
      const [effects, setEffects] = useState([]);
      const [timeLeft, setTimeLeft] = useState(30);
      const [perfectHits, setPerfectHits] = useState(0);
      const [totalNotes, setTotalNotes] = useState(0);
      const noteIdRef = useRef(0);
      const gameLoopRef = useRef(null);
      const hasPlompoAbility = pet.id === 'plompo';
      const hasFizzAbility = pet.id === 'fizz';
      const hasEmberAbility = pet.id === 'ember';
      const [feverMode, setFeverMode] = useState(false);

      const LANES = 4;
      const LANE_COLORS = ['#4ade80', '#60a5fa', '#fbbf24', '#f87171'];
      const NOTE_SPEED = hasPlompoAbility ? 2.5 : 3; // Plompo = slower

      const startGame = () => {
        setGameState('playing');
        setScore(0);
        setCombo(0);
        setMaxCombo(0);
        setNotes([]);
        setPerfectHits(0);
        setTotalNotes(0);
        setTimeLeft(30);
        AudioManager.playSfx('levelUp');
      };

      // Game loop
      useEffect(() => {
        if (gameState !== 'playing') return;

        // Spawn notes
        const spawnInterval = setInterval(() => {
          const lane = Math.floor(Math.random() * LANES);
          const newNote = {
            id: noteIdRef.current++,
            lane,
            y: -10,
            hit: false
          };
          setNotes(prev => [...prev, newNote]);
          setTotalNotes(t => t + 1);
        }, 600);

        // Move notes
        const moveInterval = setInterval(() => {
          setNotes(prev => prev
            .map(note => ({ ...note, y: note.y + NOTE_SPEED }))
            .filter(note => note.y < 110 || note.hit)
          );
        }, 50);

        // Timer
        const timerInterval = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1) {
              setGameState('finished');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => {
          clearInterval(spawnInterval);
          clearInterval(moveInterval);
          clearInterval(timerInterval);
        };
      }, [gameState, NOTE_SPEED]);

      // Check for ember fire streak
      useEffect(() => {
        if (hasEmberAbility && combo >= 10 && !feverMode) {
          setFeverMode(true);
          // Auto-hit notes for 3 seconds
          setTimeout(() => setFeverMode(false), 3000);
        }
      }, [combo, hasEmberAbility, feverMode]);

      const handleLaneTap = (lane) => {
        if (gameState !== 'playing') return;

        AudioManager.playSfx('tap');
        VibrationManager.vibratePreset('tap');

        // Find closest note in lane near target zone (y around 80-90)
        const targetNote = notes.find(n => n.lane === lane && !n.hit && n.y >= 70 && n.y <= 95);

        if (targetNote) {
          const distance = Math.abs(targetNote.y - 85);
          let points, timing;

          if (distance <= 5) {
            points = 100;
            timing = 'Perfect!';
            setPerfectHits(p => p + 1);
            AudioManager.playSfx('success');
          } else if (distance <= 10) {
            points = 50;
            timing = 'Good!';
          } else {
            points = 25;
            timing = 'OK';
          }

          // Apply fizz bonus during fever
          if (hasFizzAbility && combo >= 5) {
            points = Math.round(points * 1.25);
          }

          setScore(s => s + points * (1 + combo * 0.1));
          setCombo(c => {
            const newCombo = c + 1;
            if (newCombo > maxCombo) setMaxCombo(newCombo);
            return newCombo;
          });

          // Mark note as hit
          setNotes(prev => prev.map(n => n.id === targetNote.id ? { ...n, hit: true } : n));

          // Show effect
          setEffects(prev => [...prev, { id: Date.now(), lane, text: timing, points }]);
          setTimeout(() => setEffects(prev => prev.slice(1)), 500);
        } else {
          // Miss
          setCombo(0);
        }
      };

      const getRewards = () => {
        const accuracy = totalNotes > 0 ? (perfectHits / totalNotes) * 100 : 0;
        if (accuracy >= 90) return { coins: 100, gems: 3, tier: 'S Rank' };
        if (accuracy >= 75) return { coins: 75, gems: 2, tier: 'A Rank' };
        if (accuracy >= 50) return { coins: 50, gems: 1, tier: 'B Rank' };
        return { coins: 25, gems: 0, tier: 'C Rank' };
      };

      if (gameState === 'ready') {
        return (
          <div className="h-full bg-gradient-to-b from-indigo-900 to-purple-900 flex flex-col items-center justify-center p-6">
            <div className="text-6xl mb-6">🎵</div>
            <h2 className="text-2xl font-bold text-white mb-4">Rhythm Tap</h2>
            <p className="text-white/70 text-center mb-6">Tap the lanes when notes reach the target!</p>
            {hasPlompoAbility && (
              <div className="glass rounded-xl p-3 mb-4 text-center">
                <span className="text-yellow-300">⭐ Plompo's Slow Mo: Notes fall 20% slower!</span>
              </div>
            )}
            <button onClick={startGame} className="px-8 py-4 bg-gradient-to-r from-pink-500 to-purple-500 rounded-xl text-white font-bold text-lg">
              Start Game
            </button>
            <button onClick={onBack} className="mt-4 text-white/50">Back</button>
          </div>
        );
      }

      if (gameState === 'finished') {
        const rewards = getRewards();
        return (
          <div className="h-full bg-gradient-to-b from-indigo-900 to-purple-900 flex flex-col items-center justify-center p-6">
            <Confetti count={20} />
            <div className="text-6xl mb-4">🎵</div>
            <h2 className="text-2xl font-bold text-white mb-2">{rewards.tier}</h2>
            <div className="text-white/70 mb-4 text-center">
              <div>Score: {Math.round(score)}</div>
              <div>Max Combo: {maxCombo}x</div>
              <div>Accuracy: {totalNotes > 0 ? Math.round((perfectHits / totalNotes) * 100) : 0}%</div>
            </div>
            <div className="glass rounded-xl p-4 mb-6 text-center">
              <div className="text-yellow-400 text-xl font-bold">+{rewards.coins} 🪙</div>
              {rewards.gems > 0 && <div className="text-purple-400 text-lg">+{rewards.gems} 💎</div>}
            </div>
            <button onClick={() => onComplete(rewards)} className="px-8 py-4 bg-gradient-to-r from-green-500 to-emerald-500 rounded-xl text-white font-bold">
              Collect Rewards
            </button>
          </div>
        );
      }

      return (
        <div className="h-full bg-gradient-to-b from-indigo-900 to-black flex flex-col overflow-hidden">
          {/* Header */}
          <div className="p-3 flex items-center justify-between z-10">
            <button onClick={onBack} className="glass rounded-full p-2 text-white text-sm">←</button>
            <div className="flex items-center gap-4">
              <div className="text-white text-sm">⏱️ {timeLeft}s</div>
              <div className="text-yellow-300 font-bold">{Math.round(score)}</div>
              <div className={`text-sm ${combo >= 5 ? 'text-orange-400' : 'text-white/70'}`}>
                {combo}x
              </div>
            </div>
          </div>

          {/* Game area */}
          <div className="flex-1 relative">
            {/* Lanes */}
            <div className="absolute inset-0 flex">
              {[0, 1, 2, 3].map(lane => (
                <div key={lane} className="flex-1 relative border-x border-white/10">
                  {/* Lane background */}
                  <div className="absolute inset-0" style={{ background: `linear-gradient(to bottom, transparent 70%, ${LANE_COLORS[lane]}20 100%)` }} />
                </div>
              ))}
            </div>

            {/* Target line */}
            <div className="absolute bottom-20 left-0 right-0 h-1 bg-white/50" />

            {/* Notes */}
            {notes.filter(n => !n.hit).map(note => (
              <div
                key={note.id}
                className="absolute w-12 h-8 rounded-full flex items-center justify-center transition-all"
                style={{
                  left: `${(note.lane * 25) + 12.5}%`,
                  top: `${note.y}%`,
                  transform: 'translate(-50%, -50%)',
                  backgroundColor: LANE_COLORS[note.lane],
                  boxShadow: `0 0 10px ${LANE_COLORS[note.lane]}`
                }}
              >
                🎵
              </div>
            ))}

            {/* Effects */}
            {effects.map(e => (
              <div
                key={e.id}
                className="absolute text-center animate-fadeIn"
                style={{ left: `${(e.lane * 25) + 12.5}%`, top: '60%', transform: 'translateX(-50%)' }}
              >
                <div className="text-white font-bold text-sm">{e.text}</div>
                <div className="text-yellow-300 text-xs">+{e.points}</div>
              </div>
            ))}

            {/* Fever indicator */}
            {feverMode && (
              <div className="absolute top-1/4 left-1/2 -translate-x-1/2 text-orange-500 font-bold text-xl animate-pulse-custom">
                🔥 FEVER! 🔥
              </div>
            )}
          </div>

          {/* Tap buttons */}
          <div className="flex h-20">
            {[0, 1, 2, 3].map(lane => (
              <button
                key={lane}
                onClick={() => handleLaneTap(lane)}
                className="flex-1 flex items-center justify-center text-3xl active:scale-95 transition-transform"
                style={{ backgroundColor: LANE_COLORS[lane] + '40' }}
              >
                🎯
              </button>
            ))}
          </div>
        </div>
      );
    };

    // ============================================================
    // POOP SCOOP MINI-GAME (WEB-085)
    // ============================================================

    const PoopScoopGame = ({ pet, onComplete, onBack }) => {
      const [gameState, setGameState] = useState('ready');
      const [score, setScore] = useState(0);
      const [timeLeft, setTimeLeft] = useState(60);
      const [poops, setPoops] = useState([]);
      const [poopLevel, setPoopLevel] = useState(0);
      const [effects, setEffects] = useState([]);
      const poopIdRef = useRef(0);
      const hasGribAbility = pet.id === 'grib';
      const hasChomperAbility = pet.id === 'chomper';
      const hasLuxeAbility = pet.id === 'luxe';
      const [poopsCleaned, setPoopsCleaned] = useState(0);
      const [divaRageReady, setDivaRageReady] = useState(false);

      const POOP_TYPES = {
        normal: { emoji: '💩', points: 10, spawnChance: 0.79 },
        stinky: { emoji: '💩💚', points: 20, spawnChance: 0.15, timeout: 2000 },
        golden: { emoji: '✨💩', points: 50, spawnChance: 0.05 },
        rainbow: { emoji: '🌈💩', points: 100, spawnChance: 0.01 }
      };

      const startGame = () => {
        setGameState('playing');
        setScore(0);
        setTimeLeft(60);
        setPoops([]);
        setPoopLevel(0);
        setPoopsCleaned(0);
        setDivaRageReady(false);
        AudioManager.playSfx('levelUp');
      };

      // Game loop
      useEffect(() => {
        if (gameState !== 'playing') return;

        // Calculate spawn rate based on time elapsed
        const elapsed = 60 - timeLeft;
        const spawnRate = Math.min(3, 1 + (elapsed / 30)); // Start at 1, max 3 per second

        const spawnInterval = setInterval(() => {
          const rand = Math.random();
          let type = 'normal';
          if (rand < 0.01) type = 'rainbow';
          else if (rand < 0.06) type = 'golden';
          else if (rand < 0.21) type = 'stinky';

          const newPoop = {
            id: poopIdRef.current++,
            type,
            x: 10 + Math.random() * 80,
            y: 10 + Math.random() * 60,
            spawnTime: Date.now()
          };
          setPoops(prev => [...prev, newPoop]);
          setPoopLevel(prev => Math.min(100, prev + 2));
        }, 1000 / spawnRate);

        // Check stinky poop timeouts
        const stinkyCheck = setInterval(() => {
          setPoops(prev => {
            const now = Date.now();
            return prev.map(p => {
              if (p.type === 'stinky' && now - p.spawnTime > 2000 && !p.expired) {
                setScore(s => Math.max(0, s - 10));
                return { ...p, expired: true };
              }
              return p;
            });
          });
        }, 100);

        // Timer
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev <= 1 || poopLevel >= 100) {
              setGameState('finished');
              return 0;
            }
            return prev - 1;
          });
        }, 1000);

        return () => {
          clearInterval(spawnInterval);
          clearInterval(stinkyCheck);
          clearInterval(timer);
        };
      }, [gameState, timeLeft, poopLevel]);

      // Luxe diva rage check
      useEffect(() => {
        if (hasLuxeAbility && poopsCleaned > 0 && poopsCleaned % 20 === 0) {
          setDivaRageReady(true);
        }
      }, [poopsCleaned, hasLuxeAbility]);

      const handlePoopTap = (poop) => {
        if (gameState !== 'playing') return;

        AudioManager.playSfx('success');
        VibrationManager.vibratePreset('tap');

        let points = POOP_TYPES[poop.type].points;
        if (hasChomperAbility) points *= 2; // Chomper doubles points

        setScore(s => s + points);
        setPoopLevel(prev => Math.max(0, prev - 3));
        setPoopsCleaned(p => p + 1);

        // Remove poop
        setPoops(prev => prev.filter(p => p.id !== poop.id));

        // Grib magnet - remove nearby poops
        if (hasGribAbility) {
          setPoops(prev => {
            const nearby = prev.filter(p =>
              Math.abs(p.x - poop.x) < 20 && Math.abs(p.y - poop.y) < 20
            ).slice(0, 2);
            nearby.forEach(p => {
              setScore(s => s + POOP_TYPES[p.type].points);
              setPoopsCleaned(pc => pc + 1);
            });
            return prev.filter(p => !nearby.includes(p));
          });
        }

        // Show effect
        setEffects(prev => [...prev, { id: Date.now(), x: poop.x, y: poop.y, points }]);
        setTimeout(() => setEffects(prev => prev.slice(1)), 500);
      };

      const handleDivaRage = () => {
        if (!divaRageReady) return;
        AudioManager.playSfx('levelUp');
        VibrationManager.vibratePreset('levelUp');

        // Clear all poops
        const totalPoints = poops.reduce((sum, p) => sum + POOP_TYPES[p.type].points, 0);
        setScore(s => s + totalPoints);
        setPoops([]);
        setPoopLevel(0);
        setDivaRageReady(false);

        setEffects(prev => [...prev, { id: Date.now(), x: 50, y: 40, text: 'DISGUSTING!' }]);
      };

      const getRewards = () => {
        if (score >= 500) return { coins: 100, gems: 3, tier: 'Spotless' };
        if (score >= 350) return { coins: 75, gems: 2, tier: 'Clean' };
        if (score >= 200) return { coins: 50, gems: 1, tier: 'Tidy' };
        return { coins: 25, gems: 0, tier: 'Messy' };
      };

      if (gameState === 'ready') {
        return (
          <div className="h-full bg-gradient-to-b from-amber-900 to-yellow-900 flex flex-col items-center justify-center p-6">
            <div className="text-6xl mb-6">🧹</div>
            <h2 className="text-2xl font-bold text-white mb-4">Poop Scoop</h2>
            <p className="text-white/70 text-center mb-6">Tap to clean up poop before it piles up!</p>
            {hasGribAbility && (
              <div className="glass rounded-xl p-3 mb-4 text-center">
                <span className="text-yellow-300">⭐ Grib's Magnet: Clear 3 poops at once!</span>
              </div>
            )}
            {hasChomperAbility && (
              <div className="glass rounded-xl p-3 mb-4 text-center">
                <span className="text-yellow-300">⭐ Chomper: Double points! (eww)</span>
              </div>
            )}
            <button onClick={startGame} className="px-8 py-4 bg-gradient-to-r from-amber-500 to-yellow-500 rounded-xl text-black font-bold text-lg">
              Start Game
            </button>
            <button onClick={onBack} className="mt-4 text-white/50">Back</button>
          </div>
        );
      }

      if (gameState === 'finished') {
        const rewards = getRewards();
        const failed = poopLevel >= 100;
        return (
          <div className="h-full bg-gradient-to-b from-amber-900 to-yellow-900 flex flex-col items-center justify-center p-6">
            {!failed && <Confetti count={20} />}
            <div className="text-6xl mb-4">{failed ? '💩' : '✨'}</div>
            <h2 className="text-2xl font-bold text-white mb-2">
              {failed ? 'Too Much Poop!' : rewards.tier}
            </h2>
            <div className="text-white/70 mb-4">
              Score: {score} | Cleaned: {poopsCleaned}
            </div>
            <div className="glass rounded-xl p-4 mb-6 text-center">
              <div className="text-yellow-400 text-xl font-bold">+{rewards.coins} 🪙</div>
              {rewards.gems > 0 && <div className="text-purple-400 text-lg">+{rewards.gems} 💎</div>}
            </div>
            <button onClick={() => onComplete(rewards)} className="px-8 py-4 bg-gradient-to-r from-green-500 to-emerald-500 rounded-xl text-white font-bold">
              Collect Rewards
            </button>
          </div>
        );
      }

      return (
        <div className="h-full bg-gradient-to-b from-amber-800 to-yellow-900 flex flex-col">
          {/* Header */}
          <div className="p-3 flex items-center justify-between">
            <button onClick={onBack} className="glass rounded-full p-2 text-white text-sm">←</button>
            <div className="flex items-center gap-4">
              <div className="text-white text-sm">⏱️ {timeLeft}s</div>
              <div className="text-yellow-300 font-bold">{score}</div>
            </div>
            {divaRageReady && (
              <button onClick={handleDivaRage} className="bg-pink-500 px-3 py-1 rounded-full text-white text-sm animate-pulse-custom">
                👑 RAGE!
              </button>
            )}
          </div>

          {/* Poop level bar */}
          <div className="px-4">
            <div className="h-3 bg-gray-700 rounded-full overflow-hidden">
              <div
                className={`h-full transition-all ${poopLevel > 80 ? 'bg-red-500' : poopLevel > 50 ? 'bg-yellow-500' : 'bg-green-500'}`}
                style={{ width: `${poopLevel}%` }}
              />
            </div>
            <div className="text-center text-xs text-white/50 mt-1">Poop Level: {poopLevel}%</div>
          </div>

          {/* Game area */}
          <div className="flex-1 relative p-4">
            {/* Poops */}
            {poops.map(poop => (
              <button
                key={poop.id}
                onClick={() => handlePoopTap(poop)}
                className={`absolute text-3xl transition-transform hover:scale-125 active:scale-75
                  ${poop.expired ? 'opacity-50' : ''}
                  ${poop.type === 'rainbow' ? 'animate-sparkle' : ''}
                  ${poop.type === 'golden' ? 'animate-pulse-custom' : ''}
                `}
                style={{ left: `${poop.x}%`, top: `${poop.y}%`, transform: 'translate(-50%, -50%)' }}
              >
                {poop.type === 'stinky' ? '💩💚' :
                 poop.type === 'golden' ? '✨💩' :
                 poop.type === 'rainbow' ? '🌈💩' : '💩'}
              </button>
            ))}

            {/* Effects */}
            {effects.map(e => (
              <div
                key={e.id}
                className="absolute text-center animate-fadeIn pointer-events-none"
                style={{ left: `${e.x}%`, top: `${e.y}%`, transform: 'translate(-50%, -50%)' }}
              >
                {e.text ? (
                  <div className="text-pink-400 font-bold text-xl">{e.text}</div>
                ) : (
                  <>
                    <div className="text-2xl">✨</div>
                    <div className="text-yellow-300 text-sm">+{e.points}</div>
                  </>
                )}
              </div>
            ))}

            {/* Pet watching */}
            <div className="absolute bottom-4 left-1/2 -translate-x-1/2 text-4xl">
              {pet.emoji}
            </div>
          </div>
        </div>
      );
    };

    // Mini-Game Hub (Updated for 2x2 grid - WEB-080)
    const MiniGameHub = ({ state, onSelectGame, onBack }) => {
      const petState = state.petStates[state.activePetId];
      const pet = state.activePetId ? PETS[state.activePetId] : null;

        {

        },
        {
          id: 'memory_match', name: 'Memory Match', emoji: '🧠',
          desc: 'Find matching pairs!', unlockLevel: 1,

        },
        {

        {

        <div className="h-full bg-gradient-to-b from-indigo-900 to-purple-900 flex flex-col">

            <button onClick={onBack} className="glass rounded-full p-2 text-white">
              <span className="text-xl">←</span>
            </button>
            <h2 className="text-xl font-bold text-white flex items-center gap-2">

          {/* 2x2 Grid */}

                >
                  {/* Ability indicator */}
                  {hasAbility && isUnlocked && (
                    <div className="absolute -top-1 -right-1 bg-yellow-400 text-black text-xs px-2 py-0.5 rounded-full font-bold">
                      ⭐
                    </div>
                  )}

                  <span className="text-4xl">{game.emoji}</span>
                  <div className="text-white font-bold text-sm">{game.name}</div>
                  <div className="text-white/60 text-xs">{game.desc}</div>

                  {!isUnlocked ? (
                    <div className="text-yellow-400 text-xs mt-1">🔒 Lv.{game.unlockLevel}</div>
                  ) : hasAbility ? (
                    <div className="text-yellow-300 text-xs mt-1">{game.abilityDesc}</div>
                  ) : null}
                </button>
              );
            })}
          </div>

          {/* Energy cost notice */}
          <div className="p-4 text-center text-white/50 text-sm">
            Each game costs 10 energy
          </div>
        </div>
      );
    };

    // Settings Screen (Section 10)
    const SettingsScreen = ({ state, update, onBack }) => {
      const [soundEnabled, setSoundEnabled] = useState(AudioManager.soundEnabled);
      const [musicEnabled, setMusicEnabled] = useState(AudioManager.musicEnabled);
      const [vibrationEnabled, setVibrationEnabled] = useState(VibrationManager.enabled);
      const [masterVolume, setMasterVolume] = useState(AudioManager.masterVolume);
      const [showResetConfirm, setShowResetConfirm] = useState(false);

      const handleResetProgress = () => {
        localStorage.removeItem(STORAGE_KEY);
        window.location.reload();
      };

      const handleSoundToggle = () => {
        const newState = AudioManager.toggleSound();
        setSoundEnabled(newState);
        if (newState) AudioManager.playSfx('tap');
      };

      const handleMusicToggle = () => {
        const newState = AudioManager.toggleMusic();
        setMusicEnabled(newState);
      };

      const handleVibrationToggle = () => {
        const newState = VibrationManager.toggle();

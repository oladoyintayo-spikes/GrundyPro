    // ============================================================
    // DEV PANEL (Section 8)
    // ============================================================

    const DevPanel = ({ state, update, onClose }) => {
      const [expandedSections, setExpandedSections] = useState({ stats: true, economy: false, unlocks: false, reset: false });

      const toggleSection = (section) => {
        setExpandedSections(prev => ({ ...prev, [section]: !prev[section] }));
      };

      const petState = state.activePetId ? state.petStates[state.activePetId] : null;

      const updatePetStat = (key, value) => {
        if (!state.activePetId || !petState) return;
        const newPetState = { ...petState, [key]: value };
        // Update stage if level changed
        if (key === 'level') {
          newPetState.stage = value <= 6 ? 'baby' : value <= 12 ? 'youth' : 'evolved';
        }
        update({ petStates: { ...state.petStates, [state.activePetId]: newPetState } });
      };

      const adjustCurrency = (type, amount) => {
        if (type === 'coins') {
          update({ coins: Math.max(0, state.coins + amount) });
        } else {
          update({ gems: Math.max(0, state.gems + amount) });
        }
      };

      const fillInventory = () => {
        const fullInventory = {};
        Object.keys(FOODS).forEach(id => { fullInventory[id] = 99; });
        update({ inventory: fullInventory });
      };

      const unlockAllPets = () => {
        const allUnlocked = {};
        Object.keys(PETS).forEach(id => { allUnlocked[id] = true; });
        update({ unlockedPets: allUnlocked });
      };

      const lockNonStarters = () => {
        const startersOnly = {};
        Object.keys(PETS).forEach(id => { startersOnly[id] = PETS[id].isStarter; });
        update({ unlockedPets: startersOnly });
      };

      const resetCurrentPet = () => {
        if (!state.activePetId) return;
        const resetPet = createDefaultPetState(state.activePetId);
        update({ petStates: { ...state.petStates, [state.activePetId]: resetPet } });
      };

      const resetAllProgress = () => {
        if (confirm('⚠️ This will DELETE ALL progress!\n\nAre you sure you want to reset everything?')) {
          localStorage.removeItem(STORAGE_KEY);
          window.location.reload();
        }
      };

      const Section = ({ id, title, icon, children }) => (
        <div className="border-b border-yellow-500/30">
          <button
            onClick={() => toggleSection(id)}
            className="w-full p-3 flex items-center justify-between text-left hover:bg-yellow-500/10"
          >
            <span className="text-yellow-400 font-bold">{icon} {title}</span>
            <span className="text-yellow-400">{expandedSections[id] ? '▼' : '▶'}</span>
          </button>
          {expandedSections[id] && <div className="p-3 pt-0 space-y-3">{children}</div>}
        </div>
      );

      const Slider = ({ label, value, min, max, onChange }) => (
        <div>
          <div className="flex justify-between text-sm mb-1">
            <span className="text-white/70">{label}</span>
            <span className="text-yellow-400 font-mono">{value}</span>
          </div>
          <input
            type="range" min={min} max={max} value={value}
            onChange={(e) => onChange(parseInt(e.target.value))}
            className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-yellow-500"
          />
        </div>
      );

      const ButtonGroup = ({ label, buttons }) => (
        <div>
          <div className="text-white/70 text-sm mb-1">{label}</div>
          <div className="flex gap-1">
            {buttons.map((btn, i) => (
              <button
                key={i}
                onClick={btn.onClick}
                className={`flex-1 py-1 px-2 rounded text-xs font-bold transition ${btn.color || 'bg-gray-700 hover:bg-gray-600 text-white'}`}
              >
                {btn.label}
              </button>
            ))}
          </div>
        </div>
      );

      return (
        <div className="fixed top-0 right-0 w-80 h-full bg-gray-900/95 border-l-2 border-yellow-500 z-50 overflow-y-auto">
          {/* Header */}
          <div className="sticky top-0 bg-gray-900 p-3 border-b border-yellow-500 flex items-center justify-between">
            <span className="text-yellow-400 font-bold text-lg">🛠️ Dev Panel</span>
            <button onClick={onClose} className="text-white/50 hover:text-white text-xl">✕</button>
          </div>

          {/* Pet Stats Section */}
          <Section id="stats" title="Pet Stats" icon="📊">
            {petState ? (
              <>
                <div className="text-white/50 text-xs mb-2">Active: {PETS[state.activePetId]?.name || 'None'}</div>
                <Slider label="Level" value={petState.level} min={1} max={30} onChange={(v) => updatePetStat('level', v)} />
                <div>
                  <div className="flex justify-between text-sm mb-1">
                    <span className="text-white/70">XP</span>
                    <span className="text-yellow-400 font-mono">{petState.xp}</span>
                  </div>
                  <input
                    type="number" min={0} value={petState.xp}
                    onChange={(e) => updatePetStat('xp', Math.max(0, parseInt(e.target.value) || 0))}
                    className="w-full p-2 bg-gray-700 rounded text-white text-sm"
                  />
                </div>
                <Slider label="Mood" value={petState.mood} min={0} max={100} onChange={(v) => updatePetStat('mood', v)} />
                <Slider label="Hunger" value={petState.hunger} min={0} max={100} onChange={(v) => updatePetStat('hunger', v)} />
                <Slider label="Bond" value={petState.bond} min={0} max={100} onChange={(v) => updatePetStat('bond', v)} />
              </>
            ) : (
              <div className="text-white/50 text-sm">No active pet</div>
            )}
          </Section>

          {/* Economy Section */}
          <Section id="economy" title="Economy" icon="💰">
            <ButtonGroup
              label={`Coins: ${state.coins}`}
              buttons={[
                { label: '-100', onClick: () => adjustCurrency('coins', -100), color: 'bg-red-700 hover:bg-red-600 text-white' },
                { label: '-10', onClick: () => adjustCurrency('coins', -10), color: 'bg-red-600 hover:bg-red-500 text-white' },
                { label: '+10', onClick: () => adjustCurrency('coins', 10), color: 'bg-green-600 hover:bg-green-500 text-white' },
                { label: '+100', onClick: () => adjustCurrency('coins', 100), color: 'bg-green-700 hover:bg-green-600 text-white' },
              ]}
            />
            <ButtonGroup
              label={`Gems: ${state.gems}`}
              buttons={[
                { label: '-100', onClick: () => adjustCurrency('gems', -100), color: 'bg-red-700 hover:bg-red-600 text-white' },
                { label: '-10', onClick: () => adjustCurrency('gems', -10), color: 'bg-red-600 hover:bg-red-500 text-white' },
                { label: '+10', onClick: () => adjustCurrency('gems', 10), color: 'bg-green-600 hover:bg-green-500 text-white' },
                { label: '+100', onClick: () => adjustCurrency('gems', 100), color: 'bg-green-700 hover:bg-green-600 text-white' },
              ]}
            />
            <button
              onClick={fillInventory}
              className="w-full py-2 bg-purple-600 hover:bg-purple-500 rounded text-white font-bold text-sm"
            >
              🍎 Fill All Food (99 each)
            </button>
          </Section>

          {/* Unlocks Section */}
          <Section id="unlocks" title="Unlocks" icon="🔓">
            <button
              onClick={unlockAllPets}
              className="w-full py-2 bg-green-600 hover:bg-green-500 rounded text-white font-bold text-sm mb-2"
            >
              🐾 Unlock All Pets
            </button>
            <button
              onClick={lockNonStarters}
              className="w-full py-2 bg-orange-600 hover:bg-orange-500 rounded text-white font-bold text-sm"
            >
              🔒 Lock Non-Starters
            </button>
            <div className="mt-2 text-xs text-white/50">
              Unlocked: {Object.values(state.unlockedPets).filter(Boolean).length} / {Object.keys(PETS).length}
            </div>
          </Section>

          {/* Reset Section */}
          <Section id="reset" title="Reset" icon="⚠️">
            <button
              onClick={resetCurrentPet}
              className="w-full py-2 bg-orange-600 hover:bg-orange-500 rounded text-white font-bold text-sm mb-2"
            >
              🔄 Reset Current Pet to Lv.1
            </button>
            <button
              onClick={resetAllProgress}
              className="w-full py-2 bg-red-700 hover:bg-red-600 rounded text-white font-bold text-sm"
            >
              💥 RESET ALL PROGRESS
            </button>
            <div className="mt-2 text-xs text-red-400">
              Warning: Full reset cannot be undone!
            </div>
          </Section>

          {/* Quick Info */}
          <div className="p-3 text-xs text-white/30">
            <div>Press Ctrl+Shift+D to toggle</div>
            <div>Screen: {state.screen}</div>
            <div>First Session: {state.isFirstSession ? 'Yes' : 'No'}</div>
          </div>
        </div>
      );
    };

    // ============================================================
    // MAIN APP
    // ============================================================

    const App = () => {
      const [state, update] = useGameState();
      const [storyIndex, setStoryIndex] = useState(0);
      const [gemCollected, setGemCollected] = useState(null);
      const [unlockedPet, setUnlockedPet] = useState(null);
      const [devMode, setDevMode] = useState(false);

      // Keyboard shortcut for dev panel (Ctrl+Shift+D)
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.ctrlKey && e.shiftKey && e.key === 'D') {
            e.preventDefault();
            setDevMode(prev => !prev);
          }
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // Check if returning player
      useEffect(() => {
        if (!state.isFirstSession && state.activePetId && state.screen === 'splash') {
          update({ screen: 'main_menu' });
        }
      }, []);

      // Phase 2: Check login streak and daily event
      useEffect(() => {
        if (!state.activePetId) return;

        const today = new Date().toDateString();

        // Check if new day for login streak
        if (isNewDay(state.lastLoginDate)) {
          const newStreak = isConsecutiveDay(state.lastLoginDate)
            ? state.loginStreak + 1
            : 1;

          // Pick new daily event if date changed
          const newEvent = state.dailyEventDate !== today
            ? getRandomEvent()
            : state.dailyEvent;

          update({
            loginStreak: newStreak,
            lastLoginDate: Date.now(),
            streakRewardClaimed: false,
            dailyEvent: newEvent,
            dailyEventDate: today
          });
        }
      }, [state.activePetId]);

      // Streak reward claim function
      const claimStreakReward = () => {
        if (state.streakRewardClaimed) return;

        const reward = getStreakReward(state.loginStreak);
        let newCoins = state.coins + (reward.coins || 0);
        let newGems = state.gems + (reward.gems || 0);
        let newInventory = { ...state.inventory };

        if (reward.item) {
          newInventory[reward.item] = (newInventory[reward.item] || 0) + 1;
        }

        update({
          coins: newCoins,
          gems: newGems,
          inventory: newInventory,
          streakRewardClaimed: true
        });
      };

      // Phase 2: Poop generation timer
      useEffect(() => {
        if (!state.activePetId || !state.gameMode) return;

        const interval = POOP_CONFIG.getInterval(state.gameMode) * 60 * 1000; // Convert to ms

        const timer = setInterval(() => {
          const petState = state.petStates[state.activePetId];
          if (!petState) return;

          const timeSinceLastPoop = Date.now() - (petState.lastPoopTime || Date.now());
          if (timeSinceLastPoop >= interval) {
            const newPetState = {
              ...petState,
              poopCount: (petState.poopCount || 0) + 1,
              lastPoopTime: Date.now()
            };

            // Apply penalties if too many poops
            if (newPetState.poopCount > POOP_CONFIG.maxBeforePenalty) {
              newPetState.mood = Math.max(0, newPetState.mood + POOP_CONFIG.moodPenaltyPerPoop);
              newPetState.happiness = Math.max(0, (newPetState.happiness || 70) + POOP_CONFIG.happinessPenaltyPerPoop);
              newPetState.cleanlinessScore = Math.max(0, (newPetState.cleanlinessScore || 100) - 15);
            }

            update({
              petStates: { ...state.petStates, [state.activePetId]: newPetState }
            });
          }
        }, 60000); // Check every minute

        return () => clearInterval(timer);
      }, [state.activePetId, state.gameMode]);

      // Phase 3: Sickness check (Classic mode only)
      useEffect(() => {
        if (!state.activePetId || state.gameMode !== 'classic') return;

        const timer = setInterval(() => {
          const petState = state.petStates[state.activePetId];
          if (!petState || petState.isSick || petState.isDead || petState.hasVitaminProtection) return;

          // Check for sickness triggers
          let shouldGetSick = false;
          let careMistakeAdded = false;

          // Hunger low trigger
          if (petState.hunger < 20) {
            if (Math.random() < SICKNESS_CONFIG.baseChancePerNeglect) {
              shouldGetSick = true;
            }
            if (!careMistakeAdded) {
              careMistakeAdded = true;
            }
          }

          // Cleanliness low trigger
          if ((petState.cleanlinessScore || 100) < 40) {
            if (Math.random() < SICKNESS_CONFIG.baseChancePerNeglect) {
              shouldGetSick = true;
            }
          }

          // Poop excess trigger
          if ((petState.poopCount || 0) >= 4) {
            if (Math.random() < SICKNESS_CONFIG.baseChancePerNeglect) {
              shouldGetSick = true;
            }
          }

          if (shouldGetSick) {
            const newPetState = {
              ...petState,
              isSick: true,
              sicknessStartTime: Date.now(),
              careMistakes: (petState.careMistakes || 0) + 1
            };
            update({
              petStates: { ...state.petStates, [state.activePetId]: newPetState }
            });
          }
        }, 30000); // Check every 30 seconds

        return () => clearInterval(timer);
      }, [state.activePetId, state.gameMode]);

      // Phase 3: Death check (Classic mode only)
      const [showDeathModal, setShowDeathModal] = useState(false);
      const [deathCause, setDeathCause] = useState(null);

      useEffect(() => {
        if (!state.activePetId || state.gameMode !== 'classic') return;

        const petState = state.petStates[state.activePetId];
        if (!petState || petState.isDead) return;

        // Check death conditions
        for (const cause of DEATH_CONFIG.causes) {
          if (cause.condition(petState)) {
            setDeathCause(cause.type);
            setShowDeathModal(true);
            update({
              petStates: {
                ...state.petStates,
                [state.activePetId]: { ...petState, isDead: true, deathTime: Date.now() }
              }
            });
            break;
          }
        }
      }, [state.petStates[state.activePetId]?.hunger, state.petStates[state.activePetId]?.careMistakes, state.petStates[state.activePetId]?.isSick]);

      // Phase 3: Notification state
      const [notification, setNotification] = useState(null);

      // Check for notifications
      useEffect(() => {
        if (!state.activePetId) return;
        const petState = state.petStates[state.activePetId];
        if (!petState) return;

        if (petState.hunger < 20 && !notification) {
          setNotification({ type: 'hunger_critical' });
        } else if (petState.hunger < 40 && !notification) {
          setNotification({ type: 'hunger_warning' });
        } else if (petState.isSick && !notification) {
          setNotification({ type: 'sick' });
        } else if ((petState.poopCount || 0) >= 3 && !notification) {
          setNotification({ type: 'poop_warning' });
        }
      }, [state.petStates[state.activePetId]]);

      const canCollectGems = () => {
        if (!state.lastGemCollect) return true;
        const hours = (Date.now() - state.lastGemCollect) / (1000 * 60 * 60);
        return hours >= 24;
      };

      const collectGems = () => {
        const unlockedCount = Object.values(state.unlockedPets).filter(Boolean).length;
        const totalLevels = Object.values(state.petStates).reduce((s, p) => s + (p?.level || 0), 0);
        const income = BASE_DAILY_GEMS + unlockedCount + Math.floor(totalLevels * 0.1);

        update({
          gems: state.gems + income,
          totalGemsEarned: state.totalGemsEarned + income,
          lastGemCollect: Date.now(),
        });
        setGemCollected(income);
      };

      const handleScreenChange = (screen) => update({ screen });

      // Render based on current screen
      const renderScreen = () => {
        switch (state.screen) {
          case 'splash':
            return <SplashScreen onStart={() => update({ screen: state.isFirstSession ? 'story' : 'main_menu' })} />;

          case 'story':
            return (
              <StoryScreen
                screenIndex={storyIndex}
                onNext={() => {
                  if (storyIndex < STORY_SCREENS.length - 1) {
                    setStoryIndex(storyIndex + 1);
                  } else {
                    update({ screen: 'pet_pick' });
                  }
                }}
                onSkip={() => update({ screen: 'pet_pick' })}
              />
            );

          case 'pet_pick':
            return (
              <PetPickScreen
                onSelect={(petId) => {
                  const newPetState = createDefaultPetState(petId);
                  update({
                    activePetId: petId,
                    petStates: { [petId]: newPetState },
                    isFirstSession: false,
                    screen: 'tutorial',
                  });
                }}
              />
            );

          case 'tutorial':
            return (
              <TutorialScreen
                step={state.tutorialStep}
                petState={state.petStates[state.activePetId]}
                pet={PETS[state.activePetId]}
                inventory={state.inventory}
                onAction={() => {
                  const nextStep = state.tutorialStep + 1;
                  if (nextStep >= TUTORIAL_STEPS.length) {
                    // After tutorial, go to mode selection if not set
                    update({
                      tutorialCompleted: true,
                      tutorialStep: 0,
                      screen: state.gameMode ? 'pet_care' : 'mode_select'
                    });
                  } else {
                    update({ tutorialStep: nextStep });
                  }
                }}
                onSkip={() => update({
                  tutorialCompleted: true,
                  tutorialStep: 0,
                  screen: state.gameMode ? 'pet_care' : 'mode_select'
                })}
              />
            );

          case 'mode_select':
            return (
              <ModeSelectScreen
                onSelect={(mode) => {
                  update({
                    gameMode: mode,
                    modeSelectedAt: Date.now(),
                    screen: 'pet_care'
                  });
                }}
              />
            );

          case 'main_menu':
            return (
              <MainMenu
                petState={state.petStates[state.activePetId]}
                pet={PETS[state.activePetId]}
                coins={state.coins}
                gems={state.gems}
                canCollect={canCollectGems()}
                onPlay={() => handleScreenChange('pet_care')}
                onPets={() => handleScreenChange('pet_selector')}
                onShop={() => handleScreenChange('shop')}
                onGames={() => handleScreenChange('mini_games')}
                onSettings={() => handleScreenChange('settings')}
                onCollectGems={collectGems}
                loginStreak={state.loginStreak || 0}
                streakReward={state.loginStreak > 0 ? getStreakReward(state.loginStreak) : null}
                streakClaimed={state.streakRewardClaimed}
                onClaimStreak={claimStreakReward}
                dailyEvent={state.dailyEvent}
              />
            );

          case 'pet_care':
            return (
              <PetCareScreen
                state={state}
                update={update}
                onBack={() => handleScreenChange('main_menu')}
              />
            );

          case 'pet_selector':
            return (
              <PetSelectorScreen
                state={state}
                update={update}
                onBack={() => handleScreenChange('main_menu')}
                onUnlock={(pet) => setUnlockedPet(pet)}
              />
            );

          case 'shop':
            return (
              <ShopScreen
                state={state}
                update={update}
                onBack={() => handleScreenChange('main_menu')}
              />
            );

          case 'settings':
            return (
              <SettingsScreen
                state={state}
                update={update}
                onBack={() => handleScreenChange('main_menu')}
              />
            );

          case 'mini_games':
            return (
              <MiniGameHub
                state={state}
                onSelectGame={(gameId) => handleScreenChange(gameId)}
                onBack={() => handleScreenChange('main_menu')}
              />
            );

          case 'snack_catch':
            return (
              <SnackCatchGame
                pet={PETS[state.activePetId]}
                onComplete={(rewards) => {
                  const petState = state.petStates[state.activePetId];
                  const newXp = petState.xp + rewards.xp;
                  const xpNeeded = xpForLevel(petState.level);

                  if (newXp >= xpNeeded) {
                    const newLevel = petState.level + 1;
                    update({
                      coins: state.coins + rewards.coins,
                      petStates: {
                        ...state.petStates,
                        [state.activePetId]: {
                          ...petState,
                          xp: newXp - xpNeeded,
                          level: newLevel,
                          stage: getGrowthStage(newLevel)
                        }
                      },
                      screen: 'mini_games'
                    });
                  } else {
                    update({
                      coins: state.coins + rewards.coins,
                      petStates: {
                        ...state.petStates,
                        [state.activePetId]: {
                          ...petState,
                          xp: newXp
                        }
                      },
                      screen: 'mini_games'
                    });
                  }
                }}
                onBack={() => handleScreenChange('mini_games')}
              />
            );

          case 'memory_match':
            return (
              <MemoryMatchGame
                pet={PETS[state.activePetId]}
                onComplete={(rewards) => {
                  update({
                    coins: state.coins + (rewards.coins || 0),
                    gems: state.gems + (rewards.gems || 0),
                    screen: 'mini_games'
                  });
                }}
                onBack={() => handleScreenChange('mini_games')}
              />
            );

          case 'rhythm_tap':
            return (
              <RhythmTapGame
                pet={PETS[state.activePetId]}
                onComplete={(rewards) => {
                  update({
                    coins: state.coins + (rewards.coins || 0),
                    gems: state.gems + (rewards.gems || 0),
                    screen: 'mini_games'
                  });
                }}
                onBack={() => handleScreenChange('mini_games')}
              />
            );

          case 'poop_scoop':
            return (
              <PoopScoopGame
                pet={PETS[state.activePetId]}
                onComplete={(rewards) => {
                  update({
                    coins: state.coins + (rewards.coins || 0),
                    gems: state.gems + (rewards.gems || 0),
                    screen: 'mini_games'
                  });
                }}
                onBack={() => handleScreenChange('mini_games')}
              />
            );

          default:
            return <SplashScreen onStart={() => handleScreenChange('main_menu')} />;
        }
      };

      return (
        <div className="game-container">
          {renderScreen()}

          {/* Dev Panel Toggle Button */}
          <button
            onClick={() => setDevMode(prev => !prev)}
            className="fixed bottom-4 right-4 w-12 h-12 bg-yellow-500 hover:bg-yellow-400 rounded-full flex items-center justify-center text-2xl shadow-lg z-40 transition-transform hover:scale-110"
            title="Toggle Dev Panel (Ctrl+Shift+D)"
          >
            🛠️
          </button>

          {/* Dev Panel */}
          {devMode && <DevPanel state={state} update={update} onClose={() => setDevMode(false)} />}

          {/* Gem collected modal */}
          {gemCollected && <GemIncomeModal amount={gemCollected} onClose={() => setGemCollected(null)} />}

          {/* Pet unlocked modal */}
          {unlockedPet && <PetUnlockModal pet={unlockedPet} onClose={() => setUnlockedPet(null)} />}

          {/* Phase 3: Death Modal */}
          {showDeathModal && state.activePetId && (
            <DeathModal
              pet={PETS[state.activePetId]}
              cause={deathCause}
              onReset={() => {
                const newPetState = createDefaultPetState(state.activePetId);
                update({
                  petStates: { ...state.petStates, [state.activePetId]: newPetState }
                });
                setShowDeathModal(false);
                setDeathCause(null);
              }}
              onClose={() => {
                setShowDeathModal(false);
                update({ screen: 'main_menu' });
              }}
            />
          )}

          {/* Phase 3: Notification Toast */}
          <NotificationToast
            notification={notification}
            onDismiss={() => setNotification(null)}
          />

          {/* Phase 6A: PWA Install Prompt */}
          <InstallPromptBanner />
        </div>
      );
    };

    // Render
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <!-- Service Worker Registration -->
  <script>
    // PWA Install Prompt Handler
    window.deferredInstallPrompt = null;
    window.isPWAInstalled = false;

    // Check if already installed
    if (window.matchMedia('(display-mode: standalone)').matches) {
      window.isPWAInstalled = true;
    }

    // Capture install prompt event
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window.deferredInstallPrompt = e;
      console.log('[PWA] Install prompt captured');
      // Dispatch custom event for React to catch
      window.dispatchEvent(new CustomEvent('pwa-install-available'));
    });

    // Track installation
    window.addEventListener('appinstalled', () => {
      window.isPWAInstalled = true;
      window.deferredInstallPrompt = null;
      console.log('[PWA] App installed successfully');
      window.dispatchEvent(new CustomEvent('pwa-installed'));
    });

    // Register service worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('./service-worker.js');
          console.log('[SW] Service Worker registered:', registration.scope);

          // Check for updates
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            console.log('[SW] New service worker installing...');

            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                console.log('[SW] New version available! Refresh to update.');
                // Could show update notification here
              }
            });
          });
        } catch (error) {
          console.log('[SW] Service Worker registration failed:', error);
        }
      });
    }

    // Helper function for React to trigger install
    window.triggerPWAInstall = async () => {
      if (!window.deferredInstallPrompt) return false;
      window.deferredInstallPrompt.prompt();
      const { outcome } = await window.deferredInstallPrompt.userChoice;
      console.log('[PWA] User choice:', outcome);
      window.deferredInstallPrompt = null;
      return outcome === 'accepted';
    };
  </script>
</body>
</html>
